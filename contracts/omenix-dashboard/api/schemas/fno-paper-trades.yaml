# Story P1: the F&O paper trades (exepex/trading design v2 section 3.2; stories E1, E4, E7, E8). Each book's account,
# its open positions and its closed trades, each book on its own (never added across books). Paper only: the owner never
# overrides a paper trade; only S1's safety stop exists.

FnoPaperTrades:
  type: object
  description: >-
    Each book's paper account, open positions and closed trades after costs, with the fills at the three owner reaction
    times. Empty state: open and closed empty and each account at its opening value (no paper trade yet)
  x-catalog: {publisher: fno, source: "each book's paper account (E1: journal/<book>/account/), the desk's fill and event records (E4, E7) and the owner-timing fills (E8)", freshness: 'after each fill or exit; marks after the close of each NSE session', story: P2, status: planned}
  x-visibility: public
  x-fill: not_built
  x-never-sent:
    - "the rules that opened or closed a trade (only what was done and why in plain words)"
  additionalProperties: false
  required: [accounts, shadows, open, closed]
  properties:
    accounts:
      type: array
      minItems: 3
      maxItems: 3
      description: One paper account per book
      items:
        type: object
        additionalProperties: false
        required: [family, as_of, opening_value, value, cash, open_trades, open_max_loss, open_risk_cap, brake]
        properties:
          brake:
            type: object
            additionalProperties: false
            description: "How far the book is from its pause: its own loss from its high against its published pause limit, in rupees (2.8.0; never a strategy's filter or threshold)"
            x-catalog: {source: "the book's equity history (E1) and the C5 profile's drawdown brake (config risk.profiles.books.drawdown_brake_rs)", story: C5}
            required: [loss_from_high, pause_at]
            properties:
              loss_from_high: {type: number, minimum: 0, x-unit: INR (Paper), description: 'Closed equity below its highest close so far'}
              pause_at: {type: number, exclusiveMinimum: 0, x-unit: INR (Paper), x-catalog: {source: "the C5 profile's drawdown brake (config risk.profiles.books.drawdown_brake_rs)", story: C5}, description: 'The published pause limit: at this loss from the high the book opens nothing new until the owner restarts it (Rs 1,20,000)'}
          family: {$ref: '#/components/schemas/FnoFamily', x-fill: built, x-record: 'paper_account:book', description: 'The book, translated from its account''s book id: book1_rules is rule, book2_hybrid is hybrid, book3_ai is ai'}
          as_of: {type: string, format: date, x-unit: date (IST), x-fill: built, x-record: 'equity_history:date', description: The session of the marks}
          opening_value: {type: number, exclusiveMinimum: 0, x-unit: INR (Paper), x-fill: built, x-record: 'account_state:capital', description: 'Opening balance plus top-ups in force, Rs 20 lakh a book'}
          value: {type: number, x-unit: INR (Paper), x-fill: built, x-record: 'account_state:marked_equity', description: 'Marked value: cash plus open positions at their marks'}
          cash: {type: number, x-unit: INR (Paper), x-fill: built, x-record: 'account_state:cash', description: Cash}
          open_trades: {type: integer, minimum: 0, x-unit: count, x-fill: built, x-record: 'account_state:open_trades', description: Open positions}
          open_max_loss: {type: number, minimum: 0, x-unit: INR (Paper), x-fill: not_built, x-catalog: {story: C5}, description: "Sum of the open positions' maximum losses, against open_risk_cap"}
          open_risk_cap: {type: number, exclusiveMinimum: 0, x-unit: INR (Paper), x-fill: not_built, x-catalog: {source: "the C5 profile's open-risk cap (config risk.profiles.books.open_risk_cap_rs)", story: C5}, description: "The book's published cap on its open positions' maximum losses (Rs 1,50,000, owner 15 Oct 2026; 2.10.0: sent, never copied into a screen)"}
    shadows:
      type: array
      description: "Shadow test accounts, each its own card and never added to a book (2.8.0); B0 is labelled measurement"
      x-catalog: {source: "each registered shadow's paper account (fno/desk/shadow_books.py)", story: E6}
      items:
        type: object
        additionalProperties: false
        required: [name, label, as_of, opening_value, value, open_trades]
        properties:
          name: {type: string, minLength: 1, x-unit: text, description: "The shadow's display name (never its rules)"}
          label: {type: string, enum: [shadow, measurement], x-unit: enum, description: 'shadow = a candidate tested on paper beside the books; measurement = B0, the measuring account'}
          as_of: {type: string, format: date, x-unit: date (IST), description: The session of the marks}
          opening_value: {type: number, exclusiveMinimum: 0, x-unit: INR (Paper), description: Its opening value}
          value: {type: number, x-unit: INR (Paper), description: Its marked value}
          open_trades: {type: integer, minimum: 0, x-unit: count, description: Open positions}
    open:
      type: array
      description: Open paper positions
      items:
        type: object
        additionalProperties: false
        required: [trade_id, family, strategy, structure, legs, opened_on, max_loss, mark_value, unrealised, days_to_expiry, monitor, alerts_today, alerts]
        properties:
          trade_id: {type: string, minLength: 1, x-unit: id, x-fill: built, x-record: 'desk_event:trade_id', description: The trade's id}
          family: {$ref: '#/components/schemas/FnoFamily', description: Its book}
          strategy: {type: string, minLength: 1, x-unit: text, description: "The version's display name (never its rules)"}
          structure: {type: string, minLength: 1, x-unit: text, description: 'The structure in plain words, e.g. "put spread"'}
          legs: {type: array, minItems: 1, x-visibility: owner, description: 'Its legs (owner only while live)', items: {$ref: '#/components/schemas/FnoLeg'}}
          opened_on: {type: string, format: date, x-unit: date (IST), description: The session it opened}
          max_loss: {type: number, minimum: 0, x-unit: INR (Paper), description: 'Most it can lose, fixed at entry'}
          mark_value: {type: number, x-unit: INR (Paper), description: 'Its value at the latest marks (quotes, not closes, for live exits)'}
          unrealised: {type: number, x-unit: INR (Paper), description: 'Profit or loss so far at the marks, before exit costs'}
          days_to_expiry: {type: integer, minimum: 0, x-unit: sessions, description: NSE sessions left to expiry}
          monitor: {type: ['string', 'null'], enum: [alert_only, intraday_exits, null], x-unit: enum, x-catalog: {story: LM1}, description: "The live monitor's mode for its version; null until LM1 runs (never a mode for a monitor that does not exist)"}
          alerts_today: {type: ['integer', 'null'], minimum: 0, x-unit: count, x-catalog: {story: LM1}, description: 'Monitor alerts on it today; null until LM1 runs'}
          alerts:
            type: array
            description: "Today's monitor alerts on it, the text and the time only (2.8.0); empty until LM1 runs. Owner only: an alert names the position and its loss"
            x-visibility: owner
            x-catalog: {source: "LM1's alert records (private, Drive)", story: LM1}
            items:
              type: object
              additionalProperties: false
              required: [at, text]
              properties:
                at: {type: string, format: date-time, x-unit: UTC time, description: The snapshot time}
                text: {type: string, minLength: 1, x-unit: text, description: 'The alert as sent to #fno-desk (never a price)'}
    closed:
      type: array
      description: Closed paper trades, newest first
      items:
        type: object
        additionalProperties: false
        required: [trade_id, family, strategy, structure, opened_on, closed_on, gross, costs, net, result, exit, fills]
        properties:
          trade_id: {type: string, minLength: 1, x-unit: id, x-fill: built, x-record: 'trade_line:trade_id', description: The trade's id}
          family: {$ref: '#/components/schemas/FnoFamily', description: Its book}
          strategy: {type: string, minLength: 1, x-unit: text, description: "The version's display name"}
          structure: {type: string, minLength: 1, x-unit: text, description: The structure in plain words}
          opened_on: {type: string, format: date, x-unit: date (IST), description: The session it opened}
          closed_on: {type: string, format: date, x-unit: date (IST), x-fill: built, x-record: 'trade_line:closed_on', description: The session it closed}
          gross: {type: number, x-unit: INR (Paper), x-fill: built, x-record: 'trade_line:gross', description: "At quoted prices, before costs, at the desk's execution-snapshot fill (E4)"}
          costs: {type: number, minimum: 0, x-unit: INR (Paper), x-catalog: {story: P2}, description: 'Charges plus pads (C1): TradeLine pads plus the sum of its charges by component; no single record field holds it, so P2 adds them up'}
          net: {type: number, x-unit: INR (Paper), x-fill: built, x-record: 'trade_line:net', description: "gross minus costs, at the desk's execution-snapshot fill (E4); the owner-timing views are in fills"}
          result: {type: string, enum: [won, lost, flat], x-unit: enum, description: 'After costs; never colour alone on screen'}
          exit: {type: string, enum: [take_profit, time_exit, max_loss_exit, expiry_settlement, safety_stop, other], x-unit: enum, description: How it closed}
          fills:
            description: 'The same entry filled at the owner''s reaction times 5, 30 and 60 minutes (E8); the verdict uses 60 (owner, 15 Oct 2026). Three views of one decision, never three trials. Null for a trade made before E8 exists (its fills were never measured; never filled in after the fact)'
            x-catalog: {source: "E8's owner-timing fill records", story: E8}
            anyOf:
              - {type: 'null'}
              - type: array
                minItems: 3
                maxItems: 3
                items:
                  type: object
                  additionalProperties: false
                  required: [minutes, outcome, net]
                  properties:
                    minutes: {type: integer, enum: [5, 30, 60], x-unit: minutes, description: The assumed owner reaction time}
                    outcome: {type: string, enum: [filled, missed_price_moved, missed_no_quote], x-unit: enum, description: 'missed_price_moved = the price left the card''s entry range; missed_no_quote = no valid quote at that snapshot (never a synthetic fill)'}
                    net: {type: ['number', 'null'], x-unit: INR (Paper), description: 'The trade''s net at that fill; null when missed'}
