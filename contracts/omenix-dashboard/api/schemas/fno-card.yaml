# Story P1: the daily trade card (exepex/trading design v2 section 4.1). One card every NSE session day: TRADE,
# NO TRADE (with a reason) or WATCH (a candidate's shadow decision, shown for learning, never to be traded). The card
# never computes its own numbers: every figure is copied from the desk's records, whose hashes are in its footer.
# Card records are kept in Google Drive only (owner, 15 Oct 2026): fields marked owner never enter a public repository.

FnoCard:
  type: object
  description: >-
    The day's trade card, PAPER ONLY. Empty state: status NO TRADE with reason no_approved_strategy (the real state
    while no strategy has passed); a missing input gives NO TRADE with reason data_check_failed and the input named
  x-catalog: {publisher: fno, source: "the day's card record (T1's CardBuilder from the decision, risk, forecast, weather and objection records)", freshness: 'once a session day at card_sent_at (target 15:08 IST)', story: T1, status: planned}
  x-visibility: public
  x-fill: not_built
  x-never-sent:
    - "the strategy's entry conditions, filters and thresholds (why it chose this day beyond the forecast and weather shown)"
    - "the AI team's and the devil's advocate's prompts and model settings"
    - "the strategy's parameters and any fitted value"
  additionalProperties: false
  required: [label, session, status, reason, reason_text, timing, trade, weather, forecast, advocate, data_checks, evidence, price_of_staying_out, if_you_cannot_act, footer]
  properties:
    label: {type: string, const: PAPER ONLY, x-unit: text, description: 'Every card is for paper trading; no card ever tells the owner to place a real order'}
    session: {type: string, format: date, x-unit: date (IST), description: The NSE session the card is for}
    status: {type: string, enum: [TRADE, NO TRADE, WATCH], x-unit: enum, description: 'TRADE = a paper trade of a strategy approved to paper; NO TRADE = nothing today, with a reason; WATCH = a candidate''s shadow decision, for learning, never to be traded'}
    reason:
      type: ['string', 'null']
      enum: [no_approved_strategy, weather_red, data_check_failed, risk_bucket_full, budget_stop, cost_wall, advocate_hard_rule, null]
      x-unit: enum
      description: Why there is no trade (NO TRADE only; null otherwise)
    reason_text: {type: string, minLength: 1, x-unit: text, description: 'The status in one plain sentence, e.g. "No trade today: no strategy has passed its test yet"'}
    timing:
      type: object
      description: The card's three times, in this order (design 4.1, timing contract)
      additionalProperties: false
      required: [market_data_cutoff, decision_finalized_at, card_sent_at, delivery]
      properties:
        market_data_cutoff: {type: string, format: date-time, x-unit: UTC time, description: 'The market pack is frozen and hashed (15:00 IST); no later market data enters the card'}
        decision_finalized_at: {type: string, format: date-time, x-unit: UTC time, description: 'The decision, the code checks and the objections are final (target 15:06 IST)'}
        card_sent_at: {type: ['string', 'null'], format: date-time, x-unit: UTC time, description: 'Slack''s server time of the post (the issuance time); null while not sent'}
        delivery: {type: string, enum: [sent, retrying, not_sent], x-unit: enum, description: 'Slack delivery; not_sent is shown as "alert NOT sent" and the next card says so'}
    trade:
      description: The position (TRADE and WATCH); null on NO TRADE
      anyOf: [{type: 'null'}, {$ref: '#/components/schemas/FnoCardTrade'}]
    weather:
      type: object
      description: The weather the card quotes (the weather screen has the details)
      x-catalog: {source: "the session's weather record (M1)", story: M1}
      additionalProperties: false
      required: [colour, why]
      properties:
        colour: {type: ['string', 'null'], enum: [GREEN, AMBER, RED, null], x-unit: enum, description: 'The weather colour; null when no weather record exists for the session'}
        why: {type: string, minLength: 1, x-unit: text, description: 'One plain line, e.g. "AMBER: VIX up 14% in 5 sessions"'}
    forecast:
      description: The house forecast the card rests on, with that forecaster's record; null when the card rests on none
      anyOf: [{type: 'null'}, {$ref: '#/components/schemas/FnoCardForecast'}]
    advocate:
      type: object
      description: "The devil's advocate's objections on the same frozen pack (T2 rule checks, T3 objections)"
      x-catalog: {source: "the session's objection record", story: T3}
      additionalProperties: false
      required: [status, objections, verdict]
      properties:
        status: {type: string, enum: [answered, advocate_unavailable, not_needed], x-unit: enum, description: 'advocate_unavailable = it did not answer by its deadline; the card went out with the code checks only and no objection is invented; not_needed on NO TRADE'}
        objections: {type: array, maxItems: 3, x-visibility: owner, description: Its three strongest objections, items: {type: string, minLength: 1, x-unit: text, description: One objection in plain words}}
        verdict: {type: ['string', 'null'], enum: [no_hard_rule_breach, hard_rule_breach, null], x-unit: enum, description: 'Its verdict; a hard-rule breach makes the card NO TRADE'}
    data_checks:
      type: object
      description: The data checks before every decision (C3) and the hard-validity checks (C4)
      x-catalog: {source: "the session's data-check record (C3, C4)", story: C3}
      x-fill: built
      additionalProperties: false
      required: [passed, missing_inputs]
      properties:
        passed: {type: boolean, x-unit: yes/no, x-record: 'check_report:ok', description: 'Every check passed (C3''s CheckReport.ok)'}
        missing_inputs: {type: array, description: 'Each missing or failed input, named', x-fill: not_built, items: {$ref: '#/components/schemas/FnoMissingInput'}}
    evidence:
      type: object
      description: How far the strategy has come and what the evidence says (design 3.1 rungs; 8.3 the real-money gate)
      x-catalog: {source: 'the version registry (D6) and the ledger (B4)', story: D6}
      additionalProperties: false
      required: [rung, label, text, real_money_eligible]
      properties:
        rung: {type: ['integer', 'null'], minimum: 0, maximum: 4, x-unit: rung 0-4, description: '0 idea, 1 its forecast beat the baseline, 2 forward shadow, 3 approved to paper by the owner, 4 real-money gate met; a TRADE card is only ever rung 3; null on NO TRADE'}
        label: {type: ['string', 'null'], enum: [strong evidence, some evidence, reasoning only, null], x-unit: enum, description: The evidence label}
        text: {type: string, x-unit: text, description: 'The evidence in one plain sentence, e.g. "some evidence: lower bound -0.02 per rupee risked after 38 trades"'}
        real_money_eligible: {type: boolean, const: false, x-unit: yes/no, description: 'Always false until the real-money gate (design 8.3) is met; this contract cannot say true'}
    price_of_staying_out:
      description: "NO TRADE only: what skipping cost or saved, from the shadow results of what was skipped; null otherwise"
      anyOf:
        - {type: 'null'}
        - type: object
          description: The price of staying out
          x-catalog: {source: 'the matched shadow fills of the skipped trades (design 2.3)', story: E8}
          additionalProperties: false
          required: [status, shadow_net]
          properties:
            status: {type: string, enum: [not_measured_yet, measured, nothing_skipped], x-unit: enum, description: 'not_measured_yet until shadow fills exist; nothing_skipped when no approved strategy wanted a trade'}
            shadow_net: {type: ['number', 'null'], x-unit: INR (Paper), description: 'Net result the skipped trades would have had after costs (negative = staying out saved money); null unless measured'}
    if_you_cannot_act: {type: string, minLength: 1, x-unit: text, description: 'What the paper record assumes if the owner cannot act in time (design 4.4), e.g. "If you cannot act by 16:08, the paper record assumes the next session at 10:15"'}
    footer:
      type: object
      description: The issuance footer (design 4.4)
      additionalProperties: false
      required: [record_hashes]
      properties:
        record_hashes: {type: array, description: 'The SHA-256 of every record the card shows', items: {$ref: '#/components/schemas/FnoRecordHash'}}
  allOf:
    - if: {properties: {status: {const: NO TRADE}}}
      then: {properties: {reason: {type: string}, trade: {type: 'null'}}}
      else: {properties: {reason: {type: 'null'}, trade: {type: object}, price_of_staying_out: {type: 'null'}}}
    - if: {properties: {reason: {const: data_check_failed}}, required: [reason]}
      then: {properties: {data_checks: {properties: {passed: {const: false}, missing_inputs: {minItems: 1}}}}}
FnoCardTrade:
  type: object
  description: The position of a TRADE or WATCH card; owner only (live strikes and entry ranges never enter a public repository)
  x-visibility: owner
  x-catalog: {source: "the day's decision record (D3) and the risk manager's sizing (C2, A14)", story: T1}
  additionalProperties: false
  required: [family, strategy, what, legs, entry, size, max_loss, worst_cases, exit_plan, costs, vol_edge, proves_wrong]
  properties:
    family: {$ref: '#/components/schemas/FnoFamily', description: The family whose strategy this is}
    strategy: {type: string, minLength: 1, x-unit: text, description: "The strategy version's display name (never its rules)"}
    what: {type: string, minLength: 1, x-unit: text, description: 'The trade in one line, e.g. "NIFTY 24 Nov 2026 put spread: buy 1 lot 22,600 PE, sell 1 lot 22,450 PE"'}
    legs: {type: array, minItems: 1, description: The legs, items: {$ref: '#/components/schemas/FnoLeg'}}
    entry:
      type: object
      description: The entry range from the 15:00 bid and ask; the card is valid until valid_until
      additionalProperties: false
      required: [kind, min_per_unit, max_per_unit, valid_until]
      properties:
        kind: {type: string, enum: [debit, credit], x-unit: enum, description: 'debit = pay to enter; credit = receive'}
        min_per_unit: {type: number, minimum: 0, x-unit: INR (Paper) per unit, description: Low end of the net price range}
        max_per_unit: {type: number, minimum: 0, x-unit: INR (Paper) per unit, description: 'High end; for a debit, do not enter above it (for a credit, do not enter below min_per_unit)'}
        valid_until: {type: string, format: date-time, x-unit: UTC time, description: 'After this time the card is stale (target 15:25 IST)'}
    size:
      type: object
      description: How much
      additionalProperties: false
      required: [lots, units, funds_at_entry]
      properties:
        lots: {type: integer, minimum: 1, x-unit: lots, description: Lots per leg}
        units: {type: integer, minimum: 1, x-unit: units, description: Lots times the lot size}
        funds_at_entry: {type: number, minimum: 0, x-unit: INR (Paper), description: 'Money tied up at entry (C2 and A14: the debit plus the short leg''s margin)'}
    max_loss: {type: number, minimum: 0, maximum: 10000, x-unit: INR (Paper), description: 'Most it can lose, charges included, fixed at entry (at most Rs 10,000 a trade, owner 14 Oct 2026)'}
    worst_cases:
      type: array
      minItems: 1
      description: The same position through the worst historical stretches (stress tests, never evidence of an edge)
      items:
        type: object
        additionalProperties: false
        required: [scenario, loss]
        properties:
          scenario: {type: string, minLength: 1, x-unit: text, description: 'e.g. "The worst 5 sessions of March 2020"'}
          loss: {type: number, minimum: 0, x-unit: INR (Paper), description: The loss in that stretch}
    exit_plan: {type: array, minItems: 1, description: "This trade's exits in plain words (what will happen, not the strategy's rules)", items: {type: string, minLength: 1, x-unit: text, description: One exit}}
    costs:
      type: object
      description: Costs and tax
      additionalProperties: false
      required: [charges_and_pads, breakeven_per_unit, tax_rate]
      properties:
        charges_and_pads: {type: number, minimum: 0, x-unit: INR (Paper), description: 'Round-trip charges (C1) plus the assumed worse fills (pads)'}
        breakeven_per_unit: {type: number, x-unit: INR (Paper) per unit, description: 'Net price at which the trade breaks even after costs'}
        tax_rate: {type: number, minimum: 0, maximum: 1, x-unit: share 0-1, description: "The owner's chosen tax scenario on the year's net F&O profit (0.312 = 31.2%)"}
    vol_edge:
      description: 'Volatility ideas only: vega per lot and the edge needed to cover full costs (design 5.6); null otherwise'
      anyOf:
        - {type: 'null'}
        - type: object
          additionalProperties: false
          required: [vega_per_lot, edge_needed_points]
          properties:
            vega_per_lot: {type: number, x-unit: INR (Paper) per volatility point, description: 'Rupees gained or lost per 1 point of implied volatility, per lot'}
            edge_needed_points: {type: number, minimum: 0, x-unit: volatility points, description: Implied-volatility points needed to cover full costs}
    proves_wrong: {type: array, minItems: 1, description: "What would prove it wrong: the version's registered pause and retire checks in plain words", items: {type: string, minLength: 1, x-unit: text, description: One check}}
FnoCardForecast:
  type: object
  description: The house forecast (G9; the baselines until something passes) and that forecaster's record
  x-catalog: {source: "the session's forecast record and G4/G8's calibration report", story: G9}
  additionalProperties: false
  required: [question, plain, probability, forecaster, record]
  properties:
    question: {type: string, pattern: '^(Q[1-5]|V[1-7](_1d|_5d)?)$', x-unit: id, description: 'The question (Q1-Q5 protocol v3, V1-V7 protocol v4)'}
    plain: {type: string, minLength: 1, x-unit: text, description: 'The question in plain words'}
    probability: {type: number, minimum: 0, maximum: 1, x-unit: probability 0-1, description: The house forecast}
    forecaster: {type: string, minLength: 1, x-unit: text, description: "The forecaster's display name"}
    record:
      type: object
      description: 'That forecaster''s record at this level, e.g. "said 0.6-0.7 on 140 days, happened on 64%"'
      additionalProperties: false
      required: [said_from, said_to, days, happened_share]
      properties:
        said_from: {type: number, minimum: 0, maximum: 1, x-unit: probability 0-1, description: Low end of the calibration bin}
        said_to: {type: number, minimum: 0, maximum: 1, x-unit: probability 0-1, description: High end of the calibration bin}
        days: {type: integer, minimum: 0, x-unit: count, description: Days it said a chance in this bin}
        happened_share: {type: ['number', 'null'], minimum: 0, maximum: 1, x-unit: share 0-1, description: 'How often it happened on those days; null with 0 days'}
