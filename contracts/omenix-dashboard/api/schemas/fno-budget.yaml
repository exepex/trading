# AI usage and the budget cap (exepex/trading stories F8 and BG1; W3g in docs/stories/W3-fno-screens.md). BG1 caps
# minutes, not rupees. No screen names an AI model or a session (exepex/trading DESK_DECISIONS).

FnoBudget:
  type: object
  description: >-
    This month's AI minutes against BG1's cap and its level, by group, with what the measure covers. Empty state: level
    unknown, every group at 0 minutes and the note saying nothing is measured yet
  x-catalog: {publisher: fno, source: "BG1's cap reading (fno/budget/cap.py CapReading) over F8's usage ledger (accounting/ai_usage.csv)", freshness: 'after each routine run, at the 07:10 IST publish', story: BG1, status: planned}
  x-visibility: public
  x-fill: not_built
  x-never-sent:
    - "the AI model's name, a session id or a routine's prompt"
  additionalProperties: false
  required: [month, level, books_and_roles_minutes, basis_minutes, cap_minutes, pct_of_cap, basis, share_pct, alert_pct, stop_pct, note, groups]
  properties:
    month: {type: string, pattern: '^\d{4}-\d{2}$', x-unit: month (YYYY-MM), description: The month measured}
    level: {type: string, enum: [ok, alert, stop, unknown], x-unit: enum, description: 'ok below alert_pct of the cap; alert from alert_pct; stop from stop_pct (AI roles stop, the AI forecasters last); unknown when nothing can be measured'}
    books_and_roles_minutes: {type: number, minimum: 0, x-unit: minutes, description: "The AI books' and roles' session minutes this month"}
    basis_minutes: {type: number, minimum: 0, x-unit: minutes, description: 'What the cap is a share of: all measured session minutes (until December 2026), then the owner''s plan minutes'}
    cap_minutes: {type: number, minimum: 0, x-unit: minutes, description: 'The cap: share_pct of the basis'}
    pct_of_cap: {type: ['number', 'null'], minimum: 0, x-unit: percent, description: 'Books and roles as a share of the cap; null with nothing to measure against'}
    basis: {type: string, enum: [measured, plan], x-unit: enum, description: 'measured = a share of measured minutes; plan = a share of the owner''s plan minutes'}
    share_pct: {type: number, exclusiveMinimum: 0, maximum: 100, x-unit: percent, x-catalog: {source: "BG1's config (budget.books_and_roles_share_pct)", story: BG1}, description: 'The cap as a share of the basis (50, owner 15 Oct 2026; 2.11.0: sent, never copied into a screen)'}
    alert_pct: {type: number, exclusiveMinimum: 0, x-unit: percent, x-catalog: {source: "BG1's config (budget.alert_pct)", story: BG1}, description: 'The share of the cap at which the alert goes out (80, owner 15 Oct 2026)'}
    stop_pct: {type: number, exclusiveMinimum: 0, x-unit: percent, x-catalog: {source: "BG1's config (budget.stop_pct)", story: BG1}, description: 'The share of the cap at which the AI roles stop (100, owner 15 Oct 2026)'}
    note: {type: string, x-unit: text, description: 'Why the level is unknown, or why it is a lower bound (a routine not yet timing itself); empty when complete'}
    groups:
      type: array
      description: Minutes by group, largest first
      items:
        type: object
        additionalProperties: false
        required: [group, minutes, runs]
        properties:
          group: {type: string, enum: [ai_books, ai_roles, post_mortem, data_routines, development], x-unit: enum, description: 'Which kind of work used the minutes'}
          minutes: {type: number, minimum: 0, x-unit: minutes, description: Minutes this month}
          runs: {type: integer, minimum: 0, x-unit: count, description: Runs counted}
