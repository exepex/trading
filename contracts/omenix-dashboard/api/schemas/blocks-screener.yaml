# The screener's blocks (design/mockups/33-screener/notes.md; story W11), also read by the Markets overview (34): the
# breadth counts ("Is the move broad?") and the movers ("Who moved most?") are the same counts and rows. The India
# stock and F&O rows come from NSE's daily files (publisher fno: exepex/trading, owner 13 Oct 2026; not published yet); the US rows
# and the tools' view come from the stock tool. A shared schema takes its publisher from the operation's x-catalog.

ScreenerSummary:
  type: object
  additionalProperties: false
  description: >-
    Counts over each universe's rows of the day (the screener's tabs, "Today: up and down", the three tiles and the
    ready-made screens' chips; the Markets overview's breadth). India: every NSE stock (all), the Nifty 500, the F&O
    stocks and the 20 companies the stock tool follows; US: only the stock tool's 20 companies (ours)
  x-element: [h34.breadth]
  required: [as_of, universes]
  properties:
    as_of: {type: string, format: date-time, x-unit: UTC time, x-element: [h33.header], description: The close the rows are (the screener's day)}
    universes:
      type: object
      additionalProperties: false
      properties:
        all: {$ref: '#/components/schemas/UniverseCounts', x-market: india}
        n500: {$ref: '#/components/schemas/UniverseCounts', x-market: india}
        fno: {$ref: '#/components/schemas/UniverseCounts', x-market: india, description: 'Stocks with F&O on NSE. India only: absent in the US'}
        ours: {$ref: '#/components/schemas/UniverseCounts', description: 'The companies the stock tool follows. India: exepex/trading counts them over its NSE rows, from the stock tool''s list (FollowedCompaniesIndia); US: the stock tool''s own rows'}
UniverseCounts:
  type: object
  additionalProperties: false
  required: [n, up, down, flat, high, near_high, low, near_low, up_1m, screens]
  properties:
    n: {type: integer, minimum: 0, x-unit: count, x-element: [h33.tabs, h33.updown, h34.breadth], x-notes: ['h34.breadth:n']}
    up: {type: integer, minimum: 0, x-unit: count, x-element: [h33.updown, h34.breadth], x-notes: ['h34.breadth:up'], description: Stocks with d1 above 0}
    down: {type: integer, minimum: 0, x-unit: count, x-element: [h33.updown, h34.breadth], x-notes: ['h34.breadth:down']}
    flat: {type: integer, minimum: 0, x-unit: count, x-element: [h33.updown, h34.breadth], x-notes: ['h34.breadth:flat']}
    high: {type: integer, minimum: 0, x-unit: count, x-notes: ['h34.breadth:high'], description: At or above the 52-week high}
    near_high: {type: integer, minimum: 0, x-unit: count, x-element: [h33.tiles, h33.screens, h34.breadth], x-notes: ['h34.breadth:near_high'], description: 'Within 2% of the 52-week high (p >= 0.98 h): the screener''s "Near 52-week high"'}
    low: {type: integer, minimum: 0, x-unit: count, x-notes: ['h34.breadth:low']}
    near_low: {type: integer, minimum: 0, x-unit: count, x-element: [h33.tiles, h33.screens, h34.breadth], x-notes: ['h34.breadth:near_low'], description: 'Within 2% of the 52-week low (p <= 1.02 l)'}
    up_1m: {type: integer, minimum: 0, x-unit: count, x-notes: ['h34.breadth:up_1m'], description: Stocks up over the last 21 sessions}
    screens:
      type: object
      additionalProperties: false
      description: 'Counts of the other ready-made screens (the screener''s definitions in 33-screener/notes.md row 4); delivery is India only (absent in the US)'
      x-element: [h33.screens]
      required: [movers, volume, trend, fall, oversold]
      properties:
        movers: {type: integer, minimum: 0, x-unit: count, description: 'abs(d1) >= 5'}
        volume: {type: integer, minimum: 0, x-unit: count, x-element: [h33.tiles, h33.screens], description: 'v >= 3 va and va >= 50,000'}
        trend: {type: integer, minimum: 0, x-unit: count, description: 'm1 >= 10'}
        fall: {type: integer, minimum: 0, x-unit: count, description: 'm1 <= -10'}
        delivery: {type: integer, minimum: 0, x-unit: count, x-market: india, description: 'dl >= 70 and va >= 1,00,000. India only: absent in the US'}
        oversold: {type: integer, minimum: 0, x-unit: count, description: 'r < 30'}

ScreenerStocks:
  type: object
  additionalProperties: false
  description: >-
    One page of the day's stock rows, filtered and sorted by the route over the published table (query: u, screen,
    period, filters, symbols, sort, page). The Markets overview's movers are pages of it (sort d1 or value). Every
    price is the close at `as_of`. Empty state: rows empty ("No stock matches")
  x-element: [h33.table]
  required: [as_of, currency, total, page, page_size, rows]
  properties:
    as_of: {type: string, format: date-time, x-unit: UTC time}
    currency: {$ref: '#/components/schemas/Currency'}
    total: {type: integer, minimum: 0, x-unit: count, description: Rows that match, all pages}
    page: {type: integer, minimum: 1, x-unit: page number}
    page_size: {type: integer, minimum: 1, maximum: 100, x-unit: rows}
    rows:
      type: array
      items: {$ref: '#/components/schemas/ScreenerStock'}
ScreenerStock:
  type: object
  additionalProperties: false
  description: >-
    One stock at the day's close. Every figure built on past closes (d1 to y1, the 52-week h and l, the RSI) uses closes
    adjusted for the splits and bonuses up to the close, as the company contract's bars do (company.yaml); `p` and `v` are
    the day's own close and volume, which no later action changes
  x-as-of-from: ScreenerStocks
  required: [s, n, g, p, d1, w1, m1, m3, y1, h, l, v, va, r, u]
  properties:
    s: {type: string, x-unit: exchange symbol, x-element: [h33.table, h34.movers], x-notes: ['h33.table:s', 'h34.movers:s']}
    n: {type: string, x-unit: text, x-element: [h33.table, h34.movers], x-notes: ['h33.table:n', 'h34.movers:n']}
    g: {type: string, x-unit: text, x-notes: ['h33.table:g'], description: 'Industry (Nifty 500 list only; empty for other stocks)'}
    p: {type: number, x-unit: price (market currency), x-price: true, x-element: [h33.table, h33.screens, h33.filters, h33.sort, h34.movers], x-notes: ['h33.table:p', 'h33.screens:p', 'h33.filters:p', 'h33.sort:p', 'h34.movers:p'], description: Close of the day}
    d1: {$ref: '#/components/schemas/PeriodChange', x-element: [h33.period, h33.screens, h33.table, h34.movers], x-notes: ['h33.period:d1', 'h33.screens:d1', 'h34.movers:d1']}
    w1: {$ref: '#/components/schemas/PeriodChange', x-element: [h33.period, h33.table], x-notes: ['h33.period:w1']}
    m1: {$ref: '#/components/schemas/PeriodChange', x-element: [h33.period, h33.screens, h33.table], x-notes: ['h33.period:m1', 'h33.screens:m1']}
    m3: {$ref: '#/components/schemas/PeriodChange', x-element: [h33.period, h33.table], x-notes: ['h33.period:m3']}
    y1: {$ref: '#/components/schemas/PeriodChange', x-element: [h33.period, h33.table], x-notes: ['h33.period:y1']}
    h: {type: ['number', 'null'], x-unit: price (market currency), x-price: true, x-element: [h33.table, h33.screens], x-notes: ['h33.table:h', 'h33.screens:h'], description: 52-week high, x-catalog: {status: planned, source: 'computed: ours, from the daily closes adjusted for splits and bonuses as of the close'}}
    l: {type: ['number', 'null'], x-unit: price (market currency), x-price: true, x-element: [h33.table, h33.screens], x-notes: ['h33.table:l', 'h33.screens:l'], description: 52-week low, x-catalog: {status: planned, source: 'computed: ours, from the daily closes adjusted for splits and bonuses as of the close'}}
    v: {type: integer, minimum: 0, x-unit: shares, x-element: [h33.table, h33.screens, h33.filters, h33.sort, h34.movers], x-notes: ['h33.table:v', 'h33.screens:v', 'h33.filters:v', 'h33.sort:v', 'h34.movers:v'], description: 'Volume of the day (value traded = p × v, the default sort)'}
    va: {type: ['number', 'null'], minimum: 0, x-unit: shares, x-element: [h33.table, h33.screens, h33.filters, h34.movers], x-notes: ['h33.table:va', 'h33.screens:va', 'h33.filters:va', 'h34.movers:va'], description: 20-day average volume, x-catalog: {status: planned, source: 'computed: ours, from the daily volumes'}}
    dl: {type: ['number', 'null'], minimum: 0, maximum: 100, x-unit: percent, x-element: [h33.table, h33.screens, h33.filters], x-notes: ['h33.table:dl', 'h33.screens:dl', 'h33.filters:dl'], x-market: india, description: 'Delivery % (NSE security-wise file; null when NSE gives none). India only: absent in the US'}
    r: {type: ['number', 'null'], minimum: 0, maximum: 100, x-unit: index 0-100, x-element: [h33.table, h33.screens, h33.filters], x-notes: ['h33.table:r', 'h33.screens:r', 'h33.filters:r'], description: 'RSI 14 (Wilder, over the year''s closes; computed: ours)', x-catalog: {status: planned, source: 'computed: ours, from the daily closes adjusted for splits and bonuses as of the close'}}
    u:
      type: array
      description: The universes the stock belongs to (the `u` query takes the same values)
      x-element: [h33.which]
      x-notes: ['h33.which:u']
      items: {type: string, enum: [n500, fno, ours], x-unit: enum}
PeriodChange:
  type: ['number', 'null']
  description: '% change on the close 1, 5, 21, 63 or 250 sessions back, that past close adjusted for every split and bonus since (NSE''s corporate-actions file; the stock tool''s adjusted prices in the US), so a 5:1 split is not a −80 % year; null when listed later'
  x-unit: percent points
  x-catalog: {status: planned, source: 'computed: ours, from the daily closes adjusted for splits and bonuses as of the close'}

ScreenerTools:
  type: object
  additionalProperties: false
  description: >-
    The stock tool's view of the companies it follows (20 per market), for the next N sessions: how many strategies
    buy (by family), the model's chance of a rise and days to results. A company with `strategies.of` 0 shows "No view
    today". The two tools-based screens ("3+ buy", "results within 7 days") count these companies on the screen
  x-catalog: {publisher: stock, source: 'the stock tool''s strategy_predictions (made before the open), model_scores and features (days_to_results)', freshness: pre-open run, story: K5-proposed, status: published}
  x-element: [h33.tools]
  required: [as_of, horizon_days, companies]
  properties:
    as_of: {type: string, format: date, x-unit: date, description: The session the views are for}
    horizon_days: {type: integer, minimum: 1, x-unit: sessions (N+k)}
    companies:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [s, strategies, prob_up, days_to_results]
        properties:
          s: {type: string, x-unit: ticker}
          strategies:
            type: object
            additionalProperties: false
            required: [buy, of, by_family]
            properties:
              buy: {type: integer, minimum: 0, x-unit: count, x-element: [h33.tools, h33.screens], x-notes: ['h33.tools:strategies.buy', 'h33.screens:strategies.buy']}
              of: {type: integer, minimum: 0, x-unit: count, x-notes: ['h33.tools:strategies.of']}
              by_family:
                type: object
                description: Per family (rule, ai, baseline), only the families with a view
                additionalProperties: {$ref: '#/components/schemas/BuyOf'}
          prob_up: {type: ['number', 'null'], minimum: 0, maximum: 1, x-unit: probability 0-1, x-notes: ['h33.tools:prob_up']}
          days_to_results: {type: ['integer', 'null'], minimum: 0, x-unit: days, x-element: [h33.tools, h33.screens], x-notes: ['h33.tools:days_to_results', 'h33.screens:days_to_results']}

FnoScreenerSummary:
  type: object
  additionalProperties: false
  description: "Counts over the day's F&O underlyings (India only): the four build-ups (the tiles) and the other F&O screens"
  x-catalog: {publisher: fno, source: "NSE's daily F&O file (nearest monthly future, ATM call and put), computed the F&O tool's way", freshness: 'daily, after the NSE F&O file', story: TR-NSE-proposed, status: planned}
  x-element: [h33.buildup, h33.fno-screens]
  required: [as_of, n, expiry, buildups, screens]
  properties:
    as_of: {type: string, format: date-time, x-unit: UTC time}
    n: {type: integer, minimum: 0, x-unit: count, x-element: [h33.tabs, h33.buildup], description: 'Underlyings: the F&O tab''s count and the set the build-up tiles count'}
    expiry: {type: string, format: date, x-unit: date, description: The nearest monthly expiry}
    buildups:
      type: object
      additionalProperties: false
      x-element: [h33.buildup, h33.fno-screens]
      x-notes: ['h33.buildup:b']
      required: [long_buildup, short_buildup, short_covering, long_unwinding]
      properties:
        long_buildup: {type: integer, minimum: 0, x-unit: count}
        short_buildup: {type: integer, minimum: 0, x-unit: count}
        short_covering: {type: integer, minimum: 0, x-unit: count}
        long_unwinding: {type: integer, minimum: 0, x-unit: count}
    screens:
      type: object
      additionalProperties: false
      x-element: [h33.fno-screens]
      required: [ivhigh, ivlow, oiup, index]
      properties:
        ivhigh: {type: integer, minimum: 0, x-unit: count, description: 'ivr >= 80'}
        ivlow: {type: integer, minimum: 0, x-unit: count, description: 'ivr <= 20'}
        oiup: {type: integer, minimum: 0, x-unit: count, description: 'oc >= 5'}
        index: {type: integer, minimum: 0, x-unit: count, description: Index underlyings}

FnoScreenerRows:
  type: object
  additionalProperties: false
  description: >-
    One page of the day's F&O underlyings (India only), filtered and sorted by the route (query: screen, symbols,
    sort, page). The Markets overview's index options are the rows of NIFTY, BANKNIFTY, FINNIFTY and MIDCPNIFTY.
    Empty state: rows empty
  x-catalog: {publisher: fno, source: "NSE's daily F&O file (nearest monthly future, ATM call and put), computed the F&O tool's way (ATM IV: Black-Scholes on the ATM closes, rate 6.5%, no dividend)", freshness: 'daily, after the NSE F&O file', story: TR-NSE-proposed, status: planned}
  x-element: [h33.fno-table]
  required: [as_of, currency, total, page, page_size, rows]
  properties:
    as_of: {type: string, format: date-time, x-unit: UTC time}
    currency: {$ref: '#/components/schemas/Currency'}
    total: {type: integer, minimum: 0, x-unit: count}
    page: {type: integer, minimum: 1, x-unit: page number}
    page_size: {type: integer, minimum: 1, maximum: 100, x-unit: rows}
    rows:
      type: array
      items: {$ref: '#/components/schemas/FnoScreenerRow'}
FnoScreenerRow:
  type: object
  additionalProperties: false
  x-as-of-from: FnoScreenerRows
  required: [s, n, kind, fut, fc, oi, oc, b, iv, ivl, ivh, ivr, pcr, mv, x, lot]
  properties:
    s: {type: string, x-unit: NSE symbol, x-notes: ['h33.fno-table:s']}
    n: {type: string, x-unit: text, x-notes: ['h33.fno-table:n']}
    kind: {type: string, enum: [stock, index], x-unit: enum, x-element: [h33.fno-table, h33.fno-screens], x-notes: ['h33.fno-table:kind', 'h33.fno-screens:kind']}
    fut: {type: number, x-unit: INR, x-price: true, x-notes: ['h33.fno-table:fut'], description: Close of the nearest monthly future}
    fc: {type: ['number', 'null'], x-unit: percent points, x-price: true, x-notes: ['h33.fno-table:fc']}
    oi: {type: integer, minimum: 0, x-unit: units, x-notes: ['h33.fno-table:oi'], description: Futures open interest}
    oc: {type: ['number', 'null'], x-unit: percent points, x-element: [h33.fno-table, h33.fno-screens], x-notes: ['h33.fno-table:oc', 'h33.fno-screens:oc'], description: Futures open interest change}
    b: {type: string, enum: [long_buildup, short_buildup, short_covering, long_unwinding], x-unit: enum, x-element: [h33.fno-table, h34.index-options], x-notes: ['h33.fno-table:b', 'h34.index-options:b']}
    iv: {type: ['number', 'null'], x-unit: percent points (annualised), x-element: [h33.fno-table, h34.index-options], x-notes: ['h33.fno-table:iv', 'h34.index-options:iv'], description: 'ATM implied volatility (ours); null when the ATM options did not trade'}
    ivl: {type: ['number', 'null'], x-unit: percent points (annualised), x-notes: ['h33.fno-table:ivl'], description: '3-month low (days with 7+ days to expiry)'}
    ivh: {type: ['number', 'null'], x-unit: percent points (annualised), x-notes: ['h33.fno-table:ivh']}
    ivr: {type: ['integer', 'null'], minimum: 0, maximum: 100, x-unit: percent of the 3-month range, x-element: [h33.fno-table, h33.fno-screens, h34.index-options], x-notes: ['h33.fno-table:ivr', 'h33.fno-screens:ivr', 'h34.index-options:ivr']}
    pcr: {type: ['number', 'null'], minimum: 0, x-unit: ratio, x-element: [h33.fno-table, h34.index-options], x-notes: ['h33.fno-table:pcr', 'h34.index-options:pcr'], description: 'Put OI ÷ call OI, nearest monthly'}
    mv: {type: ['number', 'null'], minimum: 0, x-unit: percent of the price, x-element: [h33.fno-table, h34.index-options], x-notes: ['h33.fno-table:mv', 'h34.index-options:mv'], description: 'ATM call + put closes ÷ price: the move priced in by expiry'}
    x: {type: string, format: date, x-unit: date, x-element: [h33.fno-table, h34.index-options], x-notes: ['h33.fno-table:x', 'h34.index-options:x'], description: The expiry the readings are for}
    lot: {type: integer, minimum: 1, x-unit: units per lot, x-notes: ['h33.fno-table:lot']}
