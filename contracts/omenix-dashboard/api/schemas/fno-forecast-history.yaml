# Contract 2.9 (owner, 16 Oct 2026, exepex/trading docs/DESK_DECISIONS.md: "A only now"; reviews/claude/response_226):
# the Forecast lab's running score, report by report, as its own page, so the screen can draw the race chart and
# score any period the owner picks. Field B (settled forecasts with their outcomes) waits for about 60 scored live days.

FnoForecastHistory:
  type: object
  description: >-
    For each question, each forecaster's running average miss score as G4's report of each day gives it, live and
    rebuilt-from-history apart. A forecast is scored when its answer is known, up to the question's horizon (20
    sessions for Q1) after it was made, so the average between two reports, (n2 × m2 − n1 × m1) / (n2 − n1), is the
    average over the answers that came in between them, mostly forecasts made earlier. It is taken only within one
    series: a series never spans a change of its scored inputs (a rebuilt back-fill starts a new one, backfill_sha256).
    Empty state: questions empty (no answer scored yet)
  x-catalog: {publisher: fno, source: "G4's daily score reports (research/forecasts/scores/<day>.json, ScoreSummary per forecaster; v4: G8's reports)", freshness: 'after the close of each NSE session (outcomes resolve, scores refresh)', story: G8, status: planned}
  x-visibility: public
  x-fill: not_built
  x-never-sent:
    - "how any forecaster forecasts: its inputs, method, prompts or fitted values (only how it scored)"
    - "single forecasts and their outcomes (field B, after about 60 scored live days; owner, 16 Oct 2026)"
  additionalProperties: false
  required: [questions]
  properties:
    questions:
      type: array
      description: One entry per question with at least one scored answer, in the Forecast lab's order
      items: {$ref: '#/components/schemas/FnoForecastHistoryQuestion'}

FnoForecastHistoryQuestion:
  type: object
  description: One question's running scores
  additionalProperties: false
  required: [id, protocol, plain, metric, series]
  properties:
    id: {type: string, pattern: '^(Q[1-5]|V[1-7](_1d|_5d)?)$', x-unit: id, description: 'Q1-Q5 (v3) or V1-V7 (v4)'}
    protocol: {type: string, enum: [v3, v4], x-unit: id, description: Its protocol version}
    plain: {type: string, minLength: 1, x-unit: text, description: 'The question in plain words (the Forecast lab''s own text)'}
    metric: {type: string, enum: [brier, qlike], x-unit: enum, description: 'The miss score: Brier (0 perfect) for chances, QLIKE (lower is better) for variance'}
    series:
      type: array
      description: "One series per forecaster and label; the yardstick is the Forecast lab page's primary_baseline for the same question (one copy). A live series and a rebuilt one are never joined"
      items:
        type: object
        additionalProperties: false
        required: [forecaster, label, backfill_sha256, points]
        # a rebuilt series names its back-fill file; a live one names none (judge 224)
        if: {properties: {label: {const: backfill_exploratory}}}
        then: {properties: {backfill_sha256: {type: string}}}
        else: {properties: {backfill_sha256: {type: 'null'}}}
        properties:
          forecaster: {type: string, pattern: '^[a-z0-9_]+$', x-unit: id, description: The forecaster id (its name is on the Forecast lab page)}
          label: {type: string, enum: [live, backfill_exploratory], x-unit: enum, description: "live = G4's live mode (live_1500_proxy: forecasts made before the day's cutoff); backfill_exploratory = G4's back-fill mode (close_proxy: rebuilt later from history, never a live record)"}
          backfill_sha256: {type: ['string', 'null'], pattern: '^[0-9a-f]{64}$', x-unit: SHA-256, description: "backfill_exploratory only: the back-fill file the series was scored on (G4's inputs.backfill_sha256). The producer starts a new series when it changes, because a rebuilt back-fill moves every running average at once and a difference across it means nothing; the screen draws the newest. null for live"}
          points:
            type: array
            description: "One point per G4 report (its as_of), oldest first; a day without a report has no point, and a forecaster with no scored answer yet has none"
            items:
              type: object
              additionalProperties: false
              required: [as_of, n, mean_loss]
              properties:
                as_of: {type: string, format: date, x-unit: date (IST), description: "The day of G4's report"}
                n: {type: integer, minimum: 1, x-unit: count, x-fill: built, x-record: 'score_summary:scored', description: "Answers scored so far: forecasts whose answer is known (G4's counts.resolved), up to the horizon after each was made"}
                mean_loss: {type: number, x-unit: the question's metric, x-fill: built, x-record: 'score_summary:mean_brier', description: 'Average miss score over those n answers: Brier (v3, G4''s ScoreSummary.mean_brier) or QLIKE (v4: G8 adds it; the record named holds only Brier today)'}
