# ---------- F&O absent in the US (not empty, not null: absent) ----------
UsPriceSourcesRule:
  description: 'In the US only the close exists: eod and snap3pm (F&O sources) are absent'
  if: {properties: {market: {const: us}}, required: [market]}
  then: {properties: {payload: {properties: {sources: {properties: {eod: false, snap3pm: false}}}}}}
UsAccountsRule:
  description: 'In the US the Manual account has no F&O figures: open_structures and at_risk are absent'
  if: {properties: {market: {const: us}}, required: [market]}
  then: {properties: {payload: {properties: {accounts: {properties: {manual: {properties: {open_structures: false, at_risk: false}}}}}}}}
UsEventsRule:
  description: 'In the US no India-only event is listed: no NSE F&O expiry (monthly or weekly), no RBI policy decision'
  if: {properties: {market: {const: us}}, required: [market]}
  then: {properties: {payload: {properties: {events: {items: {properties: {kind: {not: {enum: [fno_expiry, weekly_expiry, rbi_policy]}}}}}}}}}
IndiaStockEventsRule:
  description: 'In India the NSE F&O expiries are exepex/trading''s (getFnoEvents, 2.5): the stock tool''s calendar lists none'
  if: {properties: {market: {const: india}}, required: [market]}
  then: {properties: {payload: {properties: {events: {items: {properties: {kind: {not: {enum: [fno_expiry, weekly_expiry]}}}}}}}}}
FnoEventsRule:
  description: 'The F&O calendar lists only NSE F&O expiries (monthly and weekly), each market-wide (no company)'
  properties: {payload: {properties: {events: {items: {properties: {kind: {enum: [fno_expiry, weekly_expiry]}, inst: {const: null}}}}}}}
IndiaAccountsRule:
  description: 'In India the Manual account carries its F&O figures'
  if: {properties: {market: {const: india}}, required: [market]}
  then: {properties: {payload: {properties: {accounts: {properties: {manual: {required: [open_structures, at_risk]}}}}}}}

