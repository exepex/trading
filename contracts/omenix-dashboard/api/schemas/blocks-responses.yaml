UsMarket:
  description: A US-only block
  properties: {market: {const: us}}
IndiaMarket:
  description: An India-only block (absent in the US)
  properties: {market: {const: india}}
IndiaScreenerSummaryRule:
  description: 'India counts every NSE stock, the Nifty 500, the F&O stocks and the stock tool''s companies'
  properties: {payload: {properties: {universes: {required: [all, n500, fno, ours], additionalProperties: {properties: {screens: {required: [delivery]}}}}}}}
UsScreenerSummaryRule:
  description: 'The US has only the stock tool''s 20 companies: no NSE universe and no F&O universe (absent, not empty)'
  properties: {payload: {properties: {universes: {required: [ours], properties: {all: false, n500: false, fno: false, ours: {properties: {screens: {properties: {delivery: false}}}}}}}}}
UsScreenerStocksRule:
  description: 'US rows belong only to the stock tool''s companies: no F&O or Nifty 500 tag, and no NSE delivery figure (dl absent, not null)'
  properties: {payload: {$ref: '#/components/schemas/UsStockRows'}}
IndiaScreenerStocksRule:
  description: 'India rows carry NSE''s delivery figure (dl; null when NSE gives none)'
  properties: {payload: {$ref: '#/components/schemas/IndiaStockRows'}}
UsStockRows:
  description: The US rule on a list of stock rows (a served page or a stored table)
  properties: {rows: {items: {properties: {u: {items: {const: ours}}, dl: false}}}}
IndiaStockRows:
  description: The India rule on a list of stock rows (a served page or a stored table)
  properties: {rows: {items: {required: [dl]}}}

