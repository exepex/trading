        cik: {type: ['string', 'null']}
        last_close: {$ref: '#/components/schemas/NullableNumber'}
        last_close_date: {type: ['string', 'null'], format: date}
        change_pct: {type: ['number', 'null'], description: '% from the previous stored close'}
        agreement_n1:
          oneOf: [{$ref: '#/components/schemas/BuySplit'}, {type: 'null'}]
        open_trades: {type: integer}
    AgreementRow:
      type: object
      x-source: warehouse/rm_entities.agreement
