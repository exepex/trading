openapi: 3.1.0
info:
  title: market-brief app API
  version: 2.14.0
  summary: Read API over the precomputed read models (docs/ARCHITECTURE.md section 4), plus planned governed writes.
  description: |
    Research only: nothing here places, routes or suggests a trade, and nothing is investment advice.
    Every signal carries "Paper only — no proven edge yet" until the weekly review's `model_skill` is true.

    Each read response is `ReadModelMeta` plus `payload`. The payload schema of each response doubles as the
    read-model payload schema: WS1 writes exactly that JSON into `rm.<table>.payload` (the table is named in
    each operation's `x-read-model`), and WS2 returns it verbatim. Field names are those of the dashboard
    payload (`scripts/marketbrief/presentation/dashboard/`), the data-kind schemas
    (`scripts/marketbrief/core/schema*.py`) and the views (`sql/views.sql`); `x-source` names where each comes
    from. Everything is as of the build's cut-off (`ReadModelMeta.cutoff`); nothing stored after it is used.

    Version 2.0 (owner's decision of 2026-10-08, option A): the approved mockups' page payloads replace the never-built
    1.0 payloads on the handover paths watchlist, stocks/{ticker}, track-record and news (their page sessions B11-B13
    replace the 1.0 schemas Watchlist, StockDetail, TrackRecord and NewsFeed); the other 1.0 endpoints stay, and the
    1.0 write endpoints are replaced as docs/SPEC.md section 5 says.

    Layout (2.0, docs/ws/b4.md "Contract layout"): this file holds the shared parts (info, security, parameters,
    responses, the schemas every page uses) and the platform paths; each page session adds `api/paths/<page>.yaml`
    (a map of path -> path item) and `api/schemas/<page>.yaml` (a map of schema name -> schema). The bundle
    (`python -m marketbrief.warehouse.openapi_spec`, from scripts/) merges them into one document; every `$ref` is
    written against that bundled document (`#/components/schemas/Market`).

    Version 2.1 (story W10, 13 Oct 2026; additions only): the signed-off frame (design/mockups/30-shell) and Home
    (31-dashboard) are served by small block endpoints (tag `blocks`, api/paths/blocks-*.yaml, api/schemas/blocks-*.yaml),
    one per independent screen block, so the screen loads its blocks in parallel and one failing block never blanks
    another. Each block response is `ReadModelMeta` plus `publisher`, `freshness` and `paper` (and `product`,
    `publication_id` for F&O), then `payload`. F&O blocks exist only under /api/v1/markets/india/fno/ (absent in the US,
    not empty). Block payloads follow the frame's units (30-shell/notes.md): changes are percent points (1.25 = +1.25 %),
    not the fractions of the 1.0/2.0 pages; probabilities stay 0-1. The data catalog of every block field is
    api/catalog/catalog.md; /api/v1/markets/{market}/home is superseded by the blocks.

    Version 2.2 (story W11, 13 Oct 2026; additions only): the screener (33-screener) and the Markets overview
    (34-markets) as block endpoints (api/paths/blocks-screener.yaml, blocks-overview.yaml). The blocks built from NSE's
    daily files are exepex/trading's (publisher `fno`, owner 13 Oct 2026), not published yet; those paths are India only.
    Where a block's publisher differs by market, India and the US have their own paths sharing one schema. Session gains
    the optional `major_event_names`; Events gains the kind `filing`.

    Version 2.3 (story W13, 13 Oct 2026; additions only): the NIFTY option chain (32-option-chain) as six India-only
    block endpoints under /api/v1/markets/india/fno/chain/ (api/paths/blocks-chain.yaml), publisher exepex/trading, not
    published yet; every object closed; history-dependent figures carry their coverage.

    Version 2.4 (W11 follow-ups, 13 Oct 2026; additions only, every served schema unchanged): what each publisher stores
    where the route serves another shape (api/schemas/blocks-stored.yaml): the screener stocks and F&O rows are stored as
    whole tables and served as pages (page_size at most 100; `x-stored`); the stock tool stores only the India companies
    it follows, which exepex/trading reads to tag and count "ours" over its NSE rows (`x-inputs`; orchestrator decision,
    13 Oct 2026, judge 40).

    Version 2.5 (owner decision, 14 Oct 2026; no field shape changed): India's NSE market blocks are exepex/trading's
    (publisher `fno`), the US equivalents stay the stock tool's. The session and the indices split by market like W11's
    blocks: getSessionIndia and getIndicesIndia (envelope FnoBlockMeta, pages `session` and `indices`) beside
    getSessionUs and getIndicesUs (stock); the URLs are unchanged. India's NSE F&O expiries leave the stock calendar for
    their own block, getFnoEvents (/api/v1/markets/india/fno/events, page `fno_events`); a screen merges it with
    getEvents and applies its own query to the merged list. getFlows moves to `fno` (page `flows`). The F&O books and
    picks keep W10's pages `risk` and `today` (orchestrator, judge 63: the contract's names win over P10's).

    Version 2.6 (13 Oct 2026; additive): Session gains `hours_status` (known | not_issued). not_issued says a session
    exists on session_date but NSE has not issued its hours (e.g. the 8 Nov 2026 muhurat session before its timings
    circular): open_utc, close_utc and next_open_utc are then null (next_open_utc is otherwise still required as a
    time). India's session always states it; the US's may omit it (known).

    Version 2.7 (story P1 of exepex/trading, owner decision 15 Oct 2026; additions only): the F&O data catalog. Five
    India-only F&O screen pages (tag `fno-screens`, api/paths/fno-screens.yaml, api/schemas/fno-*.yaml): the daily card,
    the weather, the Forecast lab, the Strategy lab and paper trades, each with Mock examples in its positive, negative
    and empty cases (api/examples/fno-screens.json) and a plain-words field table (api/catalog/fno-screens.md, generated)
    naming each field's meaning, unit, backend record, freshness, visibility and whether the backend can fill it today.
    Both repositories test against it: tools/api/check_fno_screens.py here, the pinned copy in exepex/trading.

    Version 2.8 (exepex/trading docs/stories/W3-fno-screens.md, owner decision 16 Oct 2026 "F&O screens start now";
    no F&O screen page is published yet, so its new required fields, which reject a 2.7 payload, break no live page):
    four more India-only F&O pages: the weather's history (`weather_history`, colour and label only, never an input's
    level or the chances, until the owner's weather-levels choice),
    scoreboards A and B (`scoreboards`, never combined), AI usage against BG1's minutes cap (`budget`, no model names)
    and data health (`data_health`, dates, counts and statuses only), each with Mock examples in its three cases.
    Also added to existing pages: the weather's back-fill labels (`recent[].label`, `red_share.basis`,
    `scores[].exploratory`); paper trades' shadow accounts (`shadows`, never summed with a book), each book's distance to
    its pause (`accounts[].brake`) and the monitor's alerts on an open position (`open[].alerts`, owner only).

    Version 2.9 (owner, 16 Oct 2026, exepex/trading docs/DESK_DECISIONS.md: weather levels public; the Forecast lab's
    field A only): the Forecast lab's running scores (`forecast_history`, its own page: each forecaster's running
    average miss as each day's G4 report gives it, live and rebuilt from history apart, for the race chart and a
    period the owner picks, which counts the answers that came in during it); and each session's chances back on the weather's history (`weather_history`: `p_big_1d`, `p_big_5d`,
    `base_rate_1d`, `base_rate_5d`, required). A 2.8 `weather_history` payload is rejected; no F&O screen page is
    published yet. Single forecasts with their outcomes (field B) wait for about 60 scored live days.

    Version 2.10 (judge 224 addendum 2; the W3 builder, 16 Oct 2026): each forecast-history series names the back-fill
    file it was scored on (`series[].backfill_sha256`, null for live; a rebuilt back-fill starts a new series, so a
    period is never differenced across a rebuild), and each paper book's published open-risk cap
    (`accounts[].open_risk_cap`, from C5's config, beside `brake.pause_at`), so no screen copies it. Both are
    required: a 2.9 forecast_history or paper_trades payload is rejected; neither page is published yet.

    Version 2.11 (the W3 builder, 16 Oct 2026): the card's per-trade loss cap (`trade.max_loss_cap`, from the book's
    C5 profile, `max_loss_per_trade_rs`), so the screen's cap bar never copies Rs 10,000. Required: a 2.10 card with a
    trade is rejected; the card page is not published yet. The schema's `maximum: 10000` stays as the owner's ceiling.
    Also BG1's three shares on the budget page (`share_pct`, `alert_pct`, `stop_pct`, from its config), required, so
    the screen's cap, alert mark and stop line never copy 50, 80 or 100; the budget page is not published yet.

    Version 2.12 (the P2 builder, checked on G1's PROTOCOL.md section 8, 16 Oct 2026): the Forecast lab follows G1.
    For v3, `primary_baseline` is book1_rules and `comparisons` hold only the registered tests (Book 2 and Book 3
    against Book 1); a book against a baseline is secondary and descriptive and never a comparison. Settle's
    `not_measured` also covers "no measurement built yet". The Mock examples are dated so every verdict is possible
    under the protocol (better or worse only after the first review). Also the card's `withheld` (owner, 16 Oct 2026):
    when today's card broke a risk rule (its maximum loss above its book's cap), the page carries the previous
    session's card, dated by its own session, under the owner's sentence "Today's card was held back: a risk rule was
    broken"; null on every normal day. Required: a 2.11 card is rejected; the card page is not published yet.

    Version 2.13 (the P2 builder, 16 Oct 2026): a forecast's answer day may be unknown (`today.answer_on` null) when it
    falls in a year whose NSE session calendar is not published yet, so the Forecast lab stays published instead of
    stopping each December until NSE publishes next year's holidays. Also the page `page_holds` (judge 251 on P11): in
    every publication, the F&O pages held back, each with the session its hold began, the reason (a fixed sentence, never
    a value) and whether the screen shows the previous page or nothing, so every held page says so on screen. Both are
    additions: every 2.12 payload stays valid.

    Version 2.14 (W3i, owner's UI pause exception a, 24 Oct 2026): the card's `reason` gains three codes exepex/trading's
    card already gives: `trade_fields_not_built` (T1), `hard_rule_breach` (T2: C4 refused a book's trade; not the devil's
    advocate's `advocate_hard_rule`) and `step_problems` (T1e: a desk step failed or was refused). No screen changes.
    The three codes have no Mock example yet (an example would add a mockup state, which the UI pause stops). An
    addition: every 2.13 payload stays valid; the card page is not published yet.

    Serve-time fields (2.0 page payloads): the stored payload carries no time of its build, so a rebuild of the same data
    keeps its hash. The route adds `cutoff` and `built_at` (the row's envelope) at the top of a page payload and
    `freshness` (`Freshness`, from `built_at` and the request time) to its `status` block; the status page gets
    `freshness` at its top. Everything else is the stored payload verbatim (1.0 pages entirely).

    Horizons are N+k (decision 37): buy at the open of D, the first session after the as-of close; sell at the close
    of the k-th market session after D (weekends and holidays skipped); k in `config/strategies.yaml` `horizons`.

    Conventions:
    - `x-status: planned` marks an operation, schema or field whose data is not built yet. Planned operations
      answer 501 until built; planned fields are omitted from payloads until built.
    - `x-read-model` on a read operation names its `rm` table.
    - Numbers are as stored or as the existing dashboard code computes them. Returns, changes, shares and
      probabilities are fractions (0.018 = 1.8%). The scoring fields ending in `_pct` (is50_pct, is80_pct,
      qs_pct, width50_pct, width80_pct) are percent of price (x100); `atr_pct` is a fraction (ATR / close).
    - Missing values are `null`, never invented.
  license:
    name: Private research project
servers:
  - url: /
    description: The owner's private Vercel deployment (Vercel Authentication)
tags:
  - name: markets
  - name: stocks
  - name: record
  - name: portfolio
  - name: requests
  - name: internal
  - name: blocks
    description: Small block endpoints of the frame and Home (story W10); each states the screen blocks it feeds (x-feeds)
  - name: fno-screens
    description: 'The F&O data catalog (story P1): one page per F&O screen, India only, Mock examples in three cases'
security:
  - vercelAuthentication: []
paths:
  /api/v1/markets:
    get:
      tags: [markets]
      operationId: listMarkets
      summary: Markets with their name, currency and freshness
      description: |
        Composed by the route from the `rm.status` page of each market (two keyed reads, each cached): the envelope
        has market `_all`, page_key `_`, the newest as_of, cutoff and built_at of the two, and the SHA-256 of the
        composed payload (also its ETag). A market whose status page is missing is left out; none at all is a 404.
      x-read-model: rm.status
      responses:
        '200':
          description: The markets list
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/markets/{market}/status:
    get:
      tags: [markets]
      operationId: getMarketStatus
      summary: Last daily and news run, session plan and freshness of one market
      x-read-model: rm.status
      parameters:
        - $ref: '#/components/parameters/Market'
      responses:
        '200':
          description: The status read model
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketStatusResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/markets/{market}/overview:
    get:
      tags: [markets]
      operationId: getMarketOverview
      summary: Regime, benchmark, cues, sector heatmap, signal tiers and the skill disclaimer
      x-read-model: rm.overview
      parameters:
        - $ref: '#/components/parameters/Market'
      responses:
        '200':
          description: The overview read model
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverviewResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/markets/{market}/runs:
    get:
      tags: [markets]
      operationId: listRuns
      summary: Recent daily runs, news runs and read-model builds of one market
      x-status: planned
      x-read-model: rm.runs
      parameters:
        - $ref: '#/components/parameters/Market'
      responses:
        '200':
          description: The runs read model
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunListResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/company-requests:
    post:
      tags: [requests]
      operationId: createCompanyRequest
      summary: Ask for a company to be added to a watchlist (a human applies config changes)
      x-status: planned
      x-owner: WS2 (endpoint), WS4 (validation and import)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompanyRequest'}
      responses:
        '200':
          description: Accepted into the inbox (or the receipt of an earlier request with the same key)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxReceipt'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/inbox/{inbox_id}:
    get:
      tags: [requests]
      operationId: getInboxEntry
      summary: The state of a submitted entry (pending, imported or rejected with reason)
      x-status: planned
      x-owner: WS2
      parameters:
        - name: inbox_id
          in: path
          required: true
          schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: The receipt with its current state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxReceipt'}
        '404': {$ref: '#/components/responses/NotFound'}
        '501': {$ref: '#/components/responses/NotImplemented'}
  /api/v1/internal/revalidate:
    post:
      tags: [internal]
      operationId: revalidateReadModels
      summary: Called by the sync after a build commits; invalidates the cache tags of the changed keys
      x-owner: B4 (endpoint and caller)
      security:
        - revalidateSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevalidateRequest'}
      responses:
        '200':
          description: The tags invalidated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevalidateResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}

components:
  securitySchemes:
    vercelAuthentication:
      type: apiKey
      in: cookie
      name: _vercel_jwt
      description: Vercel Authentication (deployment protection) session cookie; OAuth only once the remote MCP endpoint goes live.
    revalidateSecret:
      type: apiKey
      in: header
      name: X-Revalidate-Secret
      description: REVALIDATE_SECRET from the environment; the caller also sends Vercel's protection-bypass header.
  headers:
    ETag:
      description: '"<payload_sha256>" of the read model; unchanged across builds that produce the same payload'
      schema: {type: string}
  parameters:
    Market:
      name: market
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Market'}
    Ticker:
      name: ticker
      in: path
      required: true
      description: A ticker of the market's watchlist (config/markets/<market>.yaml `tickers`)
      schema: {$ref: '#/components/schemas/Ticker'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (UUID); becomes the inbox_id. A repeat returns the first receipt.
      schema: {type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9-]+$'}
  responses:
    NotFound:
      description: Unknown market, ticker or key
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: The warehouse is down, capped or the read model is missing; links point to the static reports
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotImplemented:
      description: A planned operation that is not built yet
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: The Idempotency-Key was used with a different body
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Invalid:
      description: The body failed validation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing or wrong secret
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ---------- shared scalars ----------
    Market:
      type: string
      enum: [india, us]
    Ticker:
      type: string
      pattern: '^[A-Z0-9.&-]{1,20}$'
    Horizon:
      type: integer
      minimum: 1
      maximum: 5
      description: >-
        k of N+k: sell at the close of the k-th market session after D (decision 37); the list is config/strategies.yaml
        `horizons` (1-5 today). Legacy rows keep their own label (`horizon_label` legacy_cc, legacy_5d_d4)
    IsoDate:
      type: string
      format: date
    IsoTime:
      type: string
      format: date-time
    NullableNumber:
      type: [number, 'null']
    NewsStatus:
      type: string
      description: Verification status as of the cut-off (constants/verification.py STATUS_PRECEDENCE)
      enum: [contradicted, confirmed_primary, corroborated, rumour, promotional, single_source, unverified]
    LabelBasis:
      type: string
      description: Scoring basis (analytics/call_basis.py); the two are never pooled
      enum: [close_to_close, open_to_close]
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        fallback_links:
          type: array
          description: Where to try again (the market's page in the live app, config/warehouse.yaml app_url)
          items: {type: string}

    # ---------- envelope ----------
    ReadModelMeta:
      type: object
      description: The metadata columns of every rm.<table> row (docs/ARCHITECTURE.md 4.1)
      required: [market, page_key, as_of, cutoff, built_at, schema_version, source_commit, payload_sha256]
      properties:
        market: {type: string, enum: [india, us, _all]}
        page_key: {type: string, description: '`_` for market-level pages, the ticker for per-stock pages'}
        as_of: {type: ['string', 'null'], format: date, description: Newest indicator snapshot stored by the cut-off}
        cutoff: {$ref: '#/components/schemas/IsoTime'}
        built_at: {$ref: '#/components/schemas/IsoTime'}
        schema_version: {type: string, description: info.version of this spec the payload conforms to}
        source_commit: {type: string, description: git commit of data/ the build read}
        payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    MarketListResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/MarketList'}
    MarketStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/MarketStatus'}
    OverviewResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/Overview'}
    RunListResponse:
      allOf:
        - $ref: '#/components/schemas/ReadModelMeta'
        - type: object
          required: [payload]
          properties:
            payload: {$ref: '#/components/schemas/RunList'}

    # ---------- payloads ----------
    MarketList:
      type: object
      x-source: core/market_config.market_names + config/markets/*.yaml + rm.status
      required: [markets]
      properties:
        markets:
          type: array
          items:
            type: object
            required: [market, name, currency]
            properties:
              market: {$ref: '#/components/schemas/Market'}
              name: {type: string}
              currency: {type: string}
              symbol: {type: string, description: CURRENCY_SYMBOLS of the currency}
              as_of: {type: ['string', 'null'], format: date}
              last_daily_run_at: {type: ['string', 'null'], format: date-time}
              last_news_run_at: {type: ['string', 'null'], format: date-time}
              freshness: {$ref: '#/components/schemas/Freshness'}

    MarketStatus:
      x-source: warehouse/rm_platform.status_pages
      description: >-
        The status page (rm.status): the shared status block plus the 1.0 fields. Served with `freshness` at the top
        (serve mode status)
      allOf:
        - {$ref: '#/components/schemas/StatusBlock'}
        - type: object
          required: [market, name, as_of, session, last_daily_run, last_news_run]
          properties:
            plan:
              oneOf: [{$ref: '#/components/schemas/SessionPlan'}, {type: 'null'}]
            last_daily_run:
              type: ['object', 'null']
              description: The newest features snapshot stored by the cut-off (the daily run's indicator step)
              x-source: warehouse/rm_platform.last_daily_run
              properties:
                as_of_date: {$ref: '#/components/schemas/IsoDate'}
                computed_at: {$ref: '#/components/schemas/IsoTime'}
            last_news_run:
              oneOf:
                - {$ref: '#/components/schemas/NewsRun'}
                - {type: 'null'}
            invalid_pages:
              type: array
              description: >-
                The pages of this market that failed validation in the sync that wrote this page (their old rows are
                served). Their freshness never counts from the sync time (web/lib/data/deps.ts)
              x-source: warehouse/read_models.build_rows
              items:
                type: object
                required: [table, page_key]
                properties:
                  table: {type: string}
                  page_key: {type: string}
            last_build:
              x-status: planned
              x-owner: B4
              oneOf:
                - {$ref: '#/components/schemas/Build'}
                - {type: 'null'}

    # ---------- shared page blocks (2.0; warehouse/rm_common.py, docs/DATA_CATALOGUE.md) ----------
    PageHeader:
      type: object
      x-source: warehouse/rm_common.header
      description: >-
        The top of every 2.0 page payload: the market, its name and currency, the newest indicator snapshot date;
        `cutoff` and `built_at` are added when served (the row's envelope)
      required: [market, name, currency, as_of]
      properties:
        market: {$ref: '#/components/schemas/Market'}
        name: {type: string, description: 'The market''s name, e.g. "India (NSE)"'}
        currency: {type: string, enum: [INR, USD]}
        as_of: {type: ['string', 'null'], format: date}
        cutoff: {type: string, format: date-time, description: Serve-time (the envelope's cutoff)}
