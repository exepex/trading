# F&O research assistant configuration.
# Every number here is a starting assumption for the paper-trading experiment.
# Change them to match your real capital and risk appetite.

# Where market data comes from: "nse" (free, public NSE website),
# "groww" (Groww Trade API, needs credentials in env vars), or "sample" (offline synthetic data).
provider: nse

underlyings: [NIFTY, BANKNIFTY]

account:
  capital: 100000          # rupees set aside for the experiment (paper money for the first month)
  max_open_trades: 5       # at most 5 open trades; a new one opens only after one closes
  max_same_direction: 3    # at most 3 open trades betting the same way (calls, or puts)
  max_index_trades: 2      # NIFTY, BANKNIFTY, FINNIFTY... move together: at most 2 at once

# Position sizing agreed with the owner (12 Oct 2026). Amounts are premium paid per trade.
position_rules:
  per_trade_budget: 10000        # buy as many full lots as fit
  budget_tolerance_pct: 10       # full lots may take a trade up to Rs 11,000
  exception_max_per_trade: 25000 # one lot above Rs 11,000 only on strong evidence, never above this
  normal_deployed: 50000         # normal total in open trades (about 5 x 10,000; +/-10% is fine)
  max_deployed: 70000            # hard cap; only strong-evidence trades may push above normal

# Holding discipline: every trade closes before expiry day, no exceptions.
holding:
  max_days: 2                    # short-term plan: intraday up to 2 trading days
  no_new_entries_after: "14:45"  # IST; avoid late entries that cannot be managed
  intraday_square_off: "15:15"   # IST; intraday trades are closed by this time

# What the paper month must show before any real-money trading (agreed later with the owner).
go_live_criteria:
  min_trading_weeks: 4
  min_closed_trades: 30
  net_profit_positive: true      # after every charge
  min_profit_factor: 1.3         # gross wins / gross losses, net of charges
  max_drawdown: 15000            # rupees, peak-to-trough on closed trades
  rule_breaks_allowed: 0         # every stop, limit and expiry exit followed

# Day-level brakes on opening new trades (closed trades, net of charges).
daily_limits:
  max_loss: 6000                 # stop trading for the day after a Rs 6,000 net loss
  profit_lock: 6000              # after a Rs 6,000 net profit today, stop opening new trades
  max_consecutive_losses: 3      # three losses in a row today: stop for the day

# Which expiries to consider (calendar days to expiry).
# Very short expiries have explosive gamma and fast theta decay; very long ones tie up capital.
expiry:
  min_dte: 3
  max_dte: 35
  max_expiries_per_underlying: 2

# Owner's plan: buy calls when the market looks strong, buy puts when it looks weak.
strategies:
  long_call: true
  long_put: true
  bull_call_spread: false  # optional: cheaper, capped-risk versions of the same views
  bear_put_spread: false
  iron_condor: false       # option selling: needs large margin, not part of the plan

# Signal thresholds.
signals:
  bias_threshold: 0.20     # |bias| below this = neutral, no directional trade
  # How strongly the directional view tilts the probability model (0 = pure market-implied).
  # Used only to rank candidates; it is an assumption, not a forecast.
  view_strength: 0.35

# Liquidity filters (per leg).
liquidity:
  min_open_interest: 500   # contracts (lots) of open interest
  max_spread_pct: 5.0      # max bid-ask spread as % of mid price
  slippage_pct: 0.5        # applied when only LTP is known (no bid/ask)

# Exit rules applied to every paper trade.
exits:
  debit_spread: {stop_loss_pct_of_debit: 50, take_profit_pct_of_max_profit: 60}
  long_option: {stop_loss_pct_of_premium: 30, take_profit_pct_of_premium: 60}
  credit_spread: {stop_loss_multiple_of_credit: 1.0, take_profit_pct_of_credit: 50}
  exit_days_before_expiry: 1
  # Protect winners: once a trade is up 30%, exit if it falls back to half of its best gain.
  trailing_stop: {enabled: true, activate_gain_pct: 30, lock_pct: 50}

# Fallback lot sizes (NSE revises these; the NSE provider infers the live value from order quantities).
lot_sizes:
  NIFTY: 65
  BANKNIFTY: 30
  FINNIFTY: 60
  MIDCPNIFTY: 120

# Groww F&O charges for options (verify against Groww's current pricing page).
charges:
  brokerage_per_order: 20.0
  stt_sell_pct: 0.1            # on sell-side premium
  exchange_txn_pct: 0.03503    # NSE options transaction charge on premium
  sebi_per_crore: 10.0
  ipft_per_crore: 50.0         # NSE investor protection fund, options premium
  stamp_duty_buy_pct: 0.003
  gst_pct: 18.0                # CGST 9% + SGST 9% (or IGST 18%)

# Live scanner (python -m fno live run). All ~200 NSE F&O underlyings, paper trades only.
live:
  chain_provider: nse              # nse now; groww once the Trade API subscription is active
  research:                        # the stock tool's research (news, verification, earnings, regime, model)
    source: repo                   # repo = its GitHub data files (default) | motherduck = its MotherDuck copy
    repo_url: https://github.com/contactexepex/agentic-stock-prediction
    market: india
  results:
    store: files                   # files = data/live/events/YYYY/MM/<date>.jsonl, saved to GitHub (default)
                                   # duckdb = MotherDuck db `database` with MOTHERDUCK_TOKEN, else a local file
    database: fno_desk
  min_days_to_expiry: 4            # holding rules never touch expiry day
  reentry_cooldown_minutes: 30     # no new trade on an underlying within 30 min of exiting it
  news_lookback_hours: 24
  always_scan: [NIFTY, BANKNIFTY]
  timings:
    scan_every_seconds: 180
    review_every_seconds: 60
    research_every_minutes: 30
  shortlist:
    size: 12                       # deep looks (option chain + candles) per scan
    min_move_pct: 0.6
    min_traded_value: 500000000    # Rs 50 crore of F&O turnover today
  thresholds:
    min_score: 0.40
    min_agreement: 0.65
    min_votes: 3
    strong_score: 0.55             # strong evidence: allows one pricier lot (up to position_rules.exception_max_per_trade)
    strong_agreement: 0.75
    strong_min_votes: 4
  contract:
    target_delta: 0.55
    strikes_each_side: 3
    min_premium: 20
    max_spread_pct: 3.0
    min_open_interest: 200
  # weight = how much each rule counts; enabled: false switches one off. Starting weights are judgement calls:
  # replace them with `python -m fno live signal-report` suggestions once each rule has enough graded votes.
  signals:
    # price action, today
    opening_range: {weight: 1.0, minutes: 15}
    vwap: {weight: 1.0, full_scale_pct: 0.6}
    intraday_trend: {weight: 1.0, fast: 9, slow: 21, full_scale_pct: 0.3}
    relative_strength: {weight: 0.8, full_scale_pct: 1.5}
    # today versus earlier sessions
    previous_day_levels: {weight: 0.8}
    volume_confirmation: {weight: 0.7, min_ratio: 1.3, full_ratio: 2.5}
    # derivatives positioning
    oi_buildup: {weight: 1.2, min_oi_change_pct: 2.0}
    option_writing: {weight: 1.0, strikes_each_side: 5}
    # market-wide backdrop
    sector_strength: {weight: 0.7, full_scale_pct: 1.0}
    market_breadth: {weight: 0.6, full_scale: 0.6}
    global_cues: {weight: 0.4, full_scale_pct: 1.0}
    vix_direction: {weight: 0.4, full_scale_pct: 8.0}
    # the stock tool's research (agentic-stock-prediction data files)
    news: {weight: 0.8, full_scale: 0.4, unverified_factor: 0.5}
    model: {weight: 0.5, full_scale: 0.1}
    announcement: {weight: 0.8, min_move_pct: 1.0, full_scale_pct: 3.0, ignored_categories: [
        "Copy of Newspaper Publication", "Trading Window", "General Updates", "Certificate under SEBI (Depositories and Participants) Regulations, 2018",
        "Analysts/Institutional Investor Meet/Con. Call Updates", "Shareholders meeting", "Loss of Share Certificate"]}
    block_deals: {weight: 0.6, full_scale_crore: 200}
    foreign_flows: {weight: 0.4, days: 3, full_scale_crore: 10000}
  guards:
    ban_list: {}
    earnings: {min_days_before_results: 2}
    market_stress: {block_on_stress: true, block_on_geopolitical: true}
    expensive_options: {max_iv_to_realised: 1.6}
  learning:
    horizons_minutes: [30, 90]     # grade every view by the price move this long afterwards
    min_abs_score: 0.2             # votes weaker than this do not count towards a hit rate
    min_votes_for_verdict: 50

# F&O Slack channel. Credentials come only from FNO_SLACK_* environment variables (see fno/notify.py).
slack:
  channel_name: fno-desk
  channel_id: C0C89E8QCCD

risk_free_rate: 0.065
