# Omenix F&O settings. Only the keys listed in fno/config.py (ALLOWED_APP_KEYS) are allowed; any other
# key is an error. Money rules (account size, per-trade risk, brake) arrive with their stories, never ad hoc.

# Market data for the `chain` and `groww-check` commands: "nse" (free, public NSE website),
# "groww" (Groww Trade API, credentials in environment variables only), "sample" (offline synthetic data),
# or "auto" (Groww when its credentials are set, else NSE).
provider: nse

# The 3 pm quote recorder (story A4) has its own source, independent of `provider` above.
quotes:
  provider: auto

underlyings: [NIFTY, BANKNIFTY]

# Fallback lot sizes (NSE revises these; the NSE provider infers the live value from order quantities).
lot_sizes:
  NIFTY: 65
  BANKNIFTY: 30
  FINNIFTY: 60
  MIDCPNIFTY: 120

# Groww F&O charges for options (verify against Groww's current pricing page).
charges:
  brokerage_per_order: 20.0
  stt_sell_pct: 0.15           # on sell-side premium; raised from 0.1% by Budget 2026, from 1 Apr 2026 (applied to all dates: C1 known limits)
  stt_exercise_pct: 0.15       # on the intrinsic value of an exercised option, paid by the purchaser; 0.125% up to 31 Mar 2026 (NSE circular NSE/FATAX/73524, Ref 02/2026, 31 Mar 2026; story E7)
  exchange_txn_pct: 0.03503    # NSE options transaction charge on premium
  sebi_per_crore: 10.0
  ipft_per_crore: 50.0         # NSE investor protection fund, options premium
  stamp_duty_buy_pct: 0.003
  gst_pct: 18.0                # CGST 9% + SGST 9% (or IGST 18%)

# F&O output goes only to #fno-desk, never to #market-brief.
slack:
  channel_name: fno-desk
  channel_id: C0C89E8QCCD

risk_free_rate: 0.065

# Risk manager (story C2, fno/risk/). Owner decisions of 12 Oct 2026 (docs/DESK_DECISIONS.md), per book on its own
# Rs 5 lakh paper account. A rule passes at its limit and refuses beyond it.
risk:
  max_loss_per_trade_rs: 10000     # one trade's modelled maximum loss, every charge and pad included
  max_open_trades: 3
  drawdown_brake_rs: 30000         # closed equity this far below its high: no new trades until the owner restarts
  max_stress_loss_rs: 30000        # open trades (from marks) plus the proposal (from entry), worst scenario below
  # Stress scenarios (design 8.1): NIFTY move in %, every leg's implied volatility times iv_factor, days that pass.
  # Replays: the NIFTY 50 and India VIX close-to-close moves of the day (previous session to that day), from
  # research/data/nifty-panel/warmup_closes.csv; tests/risk/test_scenarios_data.py checks them against those closes.
  scenarios:
    - {name: nifty_down_8pct, nifty_move_pct: -8, iv_factor: 1, days: 1}
    - {name: nifty_down_5pct, nifty_move_pct: -5, iv_factor: 1, days: 1}
    - {name: nifty_up_5pct, nifty_move_pct: 5, iv_factor: 1, days: 1}
    - {name: nifty_up_8pct, nifty_move_pct: 8, iv_factor: 1, days: 1}
    - {name: iv_double, nifty_move_pct: 0, iv_factor: 2, days: 1}
    - {name: iv_half, nifty_move_pct: 0, iv_factor: 0.5, days: 1}
    - {name: nifty_down_8pct_iv_double, nifty_move_pct: -8, iv_factor: 2, days: 1}
    - {name: nifty_up_5pct_iv_half, nifty_move_pct: 5, iv_factor: 0.5, days: 1}
    - {name: replay_2020-03-23, nifty_move_pct: -12.9805, iv_factor: 1.0729, days: 1}
    - {name: replay_2024-06-04, nifty_move_pct: -5.9294, iv_factor: 1.2775, days: 1}
    - {name: replay_2026-02-01, nifty_move_pct: -1.9557, iv_factor: 1.1079, days: 1}  # Feb 2026's largest fall
    - {name: replay_2026-02-03, nifty_move_pct: 2.5476, iv_factor: 0.9301, days: 1}   # Feb 2026's largest move
  # Proposed values, reasoning only (design 8.1); to be set from research before paper trading.
  exposure:
    nifty_move_pct: 2
    max_move_loss_rs: 15000
    iv_rise_points: 5
    max_iv_loss_rs: 15000
  # Initial margin (SPAN plus exposure) per structure, width and lot, with source and date; older than this, or
  # missing, refuses the trade.
  margins:
    file: research/data/margins/margins.csv
    max_age_days: 7
    # Story A14 criterion 1 (judge 77): NSE SPAN rows are written only after an independent broker check of the job's
    # figures passed. 14 Oct 2026: Groww's SPAN equals the row's to the rupee and its exposure equals NSE's rule to the
    # paisa on the same index base (claims response 77, "Broker check 2"); the judge decides whether this meets it.
    nse_span_check:
      source: "Groww margin API (read-only), orchestrator run"
      passed_on: 2026-10-14
  # One frozen stressed-margin method: multiplier (factor, source and as_of required; expires after max_age_days) or
  # scenario_lookup (scenario_file: a margin per scenario above). Not set yet: every trade is refused until it is.
  stressed_margin:
    method: multiplier
    multiplier: null
    source: null
    as_of: null
    max_age_days: 30

# Story E6: the paper review rule's statistics, in one place. PROVISIONAL until S1 (the evaluation protocol) freezes the
# real statistics; S1 replaces these values here, with no code change (orchestrator, 14 Oct 2026; reasoning only).
# The paper gate (20 completed positions, 3 months) is design 6's, shared with D2 in fno/constants.py.
# A review never promotes to real money by itself: that is always the owner's decision.
scorecard_review:
  status: provisional until S1
  confidence: 0.95  # two-sided interval of the mean net per completed position
  bootstrap_resamples: 10000
  bootstrap_seed: 20261014

# Story E3: the paper desk's daily timetable (IST). PROPOSED, not frozen: S1 calibrates the times from measured run
# times and freezes them in the evaluation protocol. The pack waits for the 3 pm canonical snapshot (14:55-15:10, judge
# 72); decisions are collected at the deadline; the execution snapshot is a second recorder capture; fills and exits
# finish by `fills_by`. The account lock lease covers one book's write inside the fills window, not E1's 600 seconds.
desk:
  timetable:
    status: proposed until S1
    pack: "14:58"  # first try; retried until `pack_wait_until` while the canonical snapshot is not committed yet
    pack_wait_until: "15:10"  # the recorder's window end: no canonical snapshot by then means no pack today
    decision_deadline: "15:12"
    execution_snapshot: "15:15"
    fills_by: "15:20"
    lock_lease_seconds: 60
