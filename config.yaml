# F&O research assistant configuration.
# Every number here is a starting assumption for the paper-trading experiment.
# Change them to match your real capital and risk appetite.

# Where market data comes from: "nse" (free, public NSE website),
# "groww" (Groww Trade API, needs credentials in env vars), or "sample" (offline synthetic data).
provider: nse

underlyings: [NIFTY, BANKNIFTY]

# Active settings profile. The values below are the conservative live limits (Rs 2 lakh at stake);
# `profiles.paper` scales them up for the paper-trading phase so BANKNIFTY and FINNIFTY lots fit and more
# trades are graded. Switch to `live` before any real money is used. Run with another: overrides {"profile": ...}.
profile: paper

# Safeguards are set from the research in reports/Retail FnO losses and safeguards.md (12 Oct 2026).
account:
  capital: 200000          # the most the owner will ever have at stake in F&O
  max_open_trades: 5       # at most 5 open trades; a new one opens only after one closes
  max_same_direction: 3    # at most 3 open trades betting the same way (calls, or puts)
  max_index_trades: 2      # NIFTY, BANKNIFTY, FINNIFTY... move together: at most 2 at once
  max_per_family: 2        # correlated trades are one bet: at most 2 per industry (BANKNIFTY/FINNIFTY = financials)
  max_new_trades_per_day: 2      # overtrading drives losses (SEBI FY26: traders active >100 days = 87% of losses)
  max_new_trades_per_week: 8
  cooldown_after_loss_minutes: 45  # no new entry right after any losing exit (revenge-trading guard)
  max_overnight_premium: 20000     # at most 10% of capital held overnight (gap risk); the rest closes at 15:15

# Position sizing agreed with the owner (12 Oct 2026). Amounts are premium paid per trade.
position_rules:
  per_trade_budget: 10000        # buy as many full lots as fit
  budget_tolerance_pct: 10       # full lots may take a trade up to Rs 11,000
  exception_max_per_trade: 25000 # one lot above Rs 11,000 only on strong evidence, never above this
  normal_deployed: 50000         # normal total in open trades (about 5 x 10,000; +/-10% is fine)
  max_deployed: 70000            # hard cap; only strong-evidence trades may push above normal
  risk_per_trade_pct: 2.0        # planned loss at the stop <= 2% of capital (Rs 4,000); lots are cut to fit

# Holding discipline: every trade closes before expiry day, no exceptions.
holding:
  max_days: 2                    # short-term plan: intraday up to 2 trading days
  no_new_entries_after: "14:45"  # IST; avoid late entries that cannot be managed
  intraday_square_off: "15:15"   # IST; intraday trades are closed by this time

# What paper trading must show before any real money (python -m fno live readiness checks it).
go_live_criteria:
  min_trading_weeks: 13          # about 3 months
  min_closed_trades: 100         # fewer trades cannot tell skill from luck
  net_profit_positive: true      # after every charge
  min_t_stat: 2.0                # mean net P&L per trade / its standard error
  min_profit_factor: 1.3         # gross wins / gross losses, net of charges
  max_drawdown_pct: 10           # worst peak-to-trough fall on closed trades, % of capital (Rs 20,000 live, 50,000 paper)
  rule_breaks_allowed: 0         # every stop, limit and expiry exit followed

# Automatic stop of the whole experiment: engages the kill switch for a human review.
performance_kill:
  rolling_trades: 20             # if the last 20 closed trades lose money in total...
  max_drawdown: 20000            # ...or closed-trade drawdown from the peak reaches 10% of capital

# Day-level brakes on opening new trades (closed trades, net of charges).
daily_limits:
  max_loss: 6000                 # stop trading for the day after a Rs 6,000 (3%) net loss
  profit_lock: 6000              # after a Rs 6,000 net profit today, stop opening new trades
  max_consecutive_losses: 2      # two losses in a row today: stop for the day
  weekly_max_loss: 12000         # stop for the rest of the week after a Rs 12,000 (6%) net loss

# Which expiries to consider (calendar days to expiry).
# Very short expiries have explosive gamma and fast theta decay; very long ones tie up capital.
expiry:
  min_dte: 3
  max_dte: 35
  max_expiries_per_underlying: 2

# Owner's plan: buy calls when the market looks strong, buy puts when it looks weak.
strategies:
  long_call: true
  long_put: true
  bull_call_spread: false  # optional: cheaper, capped-risk versions of the same views
  bear_put_spread: false
  iron_condor: false       # option selling: needs large margin, not part of the plan

# Signal thresholds.
signals:
  bias_threshold: 0.20     # |bias| below this = neutral, no directional trade
  # How strongly the directional view tilts the probability model (0 = pure market-implied).
  # Used only to rank candidates; it is an assumption, not a forecast.
  view_strength: 0.35

# Liquidity filters (per leg).
liquidity:
  min_open_interest: 500   # contracts (lots) of open interest
  max_spread_pct: 5.0      # max bid-ask spread as % of mid price
  slippage_pct: 0.5        # applied when only LTP is known (no bid/ask)

# Exit rules applied to every paper trade.
exits:
  debit_spread: {stop_loss_pct_of_debit: 50, take_profit_pct_of_max_profit: 60}
  long_option: {stop_loss_pct_of_premium: 30, take_profit_pct_of_premium: 60}
  credit_spread: {stop_loss_multiple_of_credit: 1.0, take_profit_pct_of_credit: 50}
  exit_days_before_expiry: 1
  # Protect winners: once a trade is up 30%, exit if it falls back to half of its best gain.
  trailing_stop: {enabled: true, activate_gain_pct: 30, lock_pct: 50}
  # Close early when credible news pushes hard against an open trade (news score -0.5 or worse for its side).
  adverse_news: {enabled: true, min_score: 0.5}

# Fallback lot sizes (NSE revises these; the NSE provider infers the live value from order quantities).
lot_sizes:
  NIFTY: 65
  BANKNIFTY: 30
  FINNIFTY: 60
  MIDCPNIFTY: 120

# Groww F&O charges for options (verify against Groww's current pricing page).
charges:
  brokerage_per_order: 20.0
  stt_sell_pct: 0.15           # on sell-side premium; raised from 0.1% by Budget 2026, from 1 Apr 2026
  exchange_txn_pct: 0.03503    # NSE options transaction charge on premium
  sebi_per_crore: 10.0
  ipft_per_crore: 50.0         # NSE investor protection fund, options premium
  stamp_duty_buy_pct: 0.003
  gst_pct: 18.0                # CGST 9% + SGST 9% (or IGST 18%)

# Live scanner (python -m fno live run). All ~200 NSE F&O underlyings, paper trades only.
live:
  chain_provider: auto             # groww when GROWW_* credentials are set (owner's PC), else the free NSE website
  research:                        # the stock tool's research (news, verification, earnings, regime, model)
    source: repo                   # repo = its GitHub data files (default) | motherduck = its MotherDuck copy
    repo_url: https://github.com/contactexepex/agentic-stock-prediction
    market: india
  results:
    store: files                   # files = data/live/events/YYYY/MM/<date>.jsonl, saved to GitHub (default)
                                   # duckdb = MotherDuck db `database` with MOTHERDUCK_TOKEN, else a local file
    database: fno_desk
  min_days_to_expiry: 4            # holding rules never touch expiry day
  reentry_cooldown_minutes: 30     # no new trade on an underlying within 30 min of exiting it
  news_lookback_hours: 24
  always_scan: [NIFTY, BANKNIFTY, FINNIFTY]
  news:                            # fast news watcher (docs/NEWS_FEED_PLAN.md): free sources, one request at a time
    enabled: true
    min_seconds_between_requests: 5   # never two requests closer than this, across all sources
    active_from: "08:45"              # trading days only, IST; nothing is fetched outside these hours
    active_until: "15:45"
    directory: data/live/news         # one small file a day, only stories about F&O names, indices or world risks
    impact:                           # story impact = type x credibility x relevance x freshness x direction
      lookback_minutes: 120
      half_life_minutes: 45           # a story's push halves every 45 minutes
      full_scale: 1.0
      world_relevance_index: 0.6      # world news (war, oil, Fed) for NIFTY/BANKNIFTY/FINNIFTY
      world_relevance_stock: 0.2      # ... and for a single stock, whose own news matters far more
      type_weights: {results: 1.0, guidance: 0.9, regulatory_action: 0.9, order_or_contract: 0.7, macro_or_world: 0.7,
                     corporate_action: 0.6, stake_sale_or_block_deal: 0.6, management_change: 0.5, broker_rating: 0.4,
                     other: 0.2, routine_filing: 0.0}
      credibility_weights: {exchange_filing: 1.0, widely_reported: 0.9, corroborated: 0.7, single_source: 0.4}
    dedupe_window_hours: 24
    sources:                          # API sources run only when their key is in ~/.trading.env
      nse_announcements: {every_seconds: 60}
      bse_announcements: {every_seconds: 60}
      finnhub: {every_seconds: 60}                      # free: 60 calls/minute allowed; we use 1
      marketaux: {every_seconds: 300, daily_limit: 95}  # free: 100 calls/day
      asknews: {every_seconds: 900, daily_limit: 20}    # pay-as-you-go: 25 free credits, then $0.025 each
    feeds:                            # each also never faster than its own cache time (30 s to 5 min)
      - {name: ET Markets, url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms", every_seconds: 90}
      - {name: Livemint Markets, url: "https://www.livemint.com/rss/markets", every_seconds: 90}
      - {name: CNBC-TV18 Market, url: "https://www.cnbctv18.com/commonfeeds/v1/cne/rss/market.xml", every_seconds: 120}
      - {name: Business Standard Markets, outlet: Business Standard, url: "https://www.business-standard.com/rss/markets-106.rss", every_seconds: 120}
      - {name: Business Standard Companies, outlet: Business Standard, url: "https://www.business-standard.com/rss/companies-101.rss", every_seconds: 180}
      - {name: BusinessLine Markets, outlet: BusinessLine, url: "https://www.thehindubusinessline.com/markets/feeder/default.rss", every_seconds: 300}
      - {name: BusinessLine Companies, outlet: BusinessLine, url: "https://www.thehindubusinessline.com/companies/feeder/default.rss", every_seconds: 300}
      - {name: BBC Business, url: "https://feeds.bbci.co.uk/news/business/rss.xml", every_seconds: 180}
      - {name: MarketWatch Bulletins, url: "https://feeds.content.dowjones.io/public/rss/mw_bulletins", every_seconds: 180}
  iv_history: {min_days: 60, lookback_days: 365}  # one ATM IV per underlying per day, stored after the close
  shadow_book:
    enabled: true                  # one quiet paper lot of every idea in journal/shadow_trades.json, no limits,
                                   # no Slack: grades ideas the portfolio limits turned away
  timings:                         # free NSE/Yahoo sources: no faster (docs/DATA_SOURCES.md); a broker feed allows 180/60
    scan_every_seconds: 300
    review_every_seconds: 120
    research_every_minutes: 30
  shortlist:
    size: 12                       # deep looks (option chain + candles) per scan
    min_move_pct: 0.6
    min_traded_value: 500000000    # Rs 50 crore of F&O turnover today
  thresholds:
    min_score: 0.40
    min_agreement: 0.65
    min_votes: 3
    strong_score: 0.55             # strong evidence: allows one pricier lot (up to position_rules.exception_max_per_trade)
    strong_agreement: 0.75
    strong_min_votes: 4
  contract:
    target_delta: 0.55
    strikes_each_side: 6           # search window; min_abs_delta and the risk limit decide what is usable
    min_premium: 25                # below this, charges plus the spread eat too much of the premium
    max_spread_pct: 2.0            # bid-ask gap for index options
    max_spread_pct_stock: 5.0      # stock options are less liquid
    min_open_interest: 200
    min_abs_delta: 0.30            # nothing further out of the money ("lottery tickets")
    max_daily_theta_pct: 12        # skip if time decay would eat more than 12% of the premium per day
    max_needed_to_likely_move: 1.5   # the +60% target may need at most 1.5x the move the market expects over the hold
    require_bid_ask: true          # never buy without a real bid/ask to check the spread (Groww: live quote)
  # weight = how much each rule counts; enabled: false switches one off. Starting weights are judgement calls:
  # replace them with `python -m fno live signal-report` suggestions once each rule has enough graded votes.
  signals:
    # price action, today
    opening_range: {weight: 1.0, minutes: 15}
    vwap: {weight: 1.0, full_scale_pct: 0.6}
    intraday_trend: {weight: 1.0, fast: 9, slow: 21, full_scale_pct: 0.3}
    relative_strength: {weight: 0.8, full_scale_pct: 1.5}
    # today versus earlier sessions
    previous_day_levels: {weight: 0.8}
    volume_confirmation: {weight: 0.7, min_ratio: 1.3, full_ratio: 2.5}
    # derivatives positioning
    oi_buildup: {weight: 1.2, min_oi_change_pct: 2.0}
    option_writing: {weight: 1.0, strikes_each_side: 5}
    # market-wide backdrop
    sector_strength: {weight: 0.7, full_scale_pct: 1.0}
    market_breadth: {weight: 0.6, full_scale: 0.6}
    global_cues: {weight: 0.4, full_scale_pct: 1.0}
    vix_direction: {weight: 0.4, full_scale_pct: 8.0}
    # the stock tool's research (agentic-stock-prediction data files)
    news: {weight: 0.8, full_scale: 0.4, unverified_factor: 0.5}
    # the desk's own fast news watcher (live.news): weighted push of the last two hours' stories
    fast_news: {weight: 0.8}
    # foreign investors' index futures and options positioning vs their recent average (indices only)
    fii_positioning: {weight: 0.6, futures_full_scale: 0.02, options_full_scale: 0.10}
    model: {weight: 0.5, full_scale: 0.1}
    announcement: {weight: 0.8, min_move_pct: 1.0, full_scale_pct: 3.0, ignored_categories: [
        "Copy of Newspaper Publication", "Trading Window", "General Updates", "Certificate under SEBI (Depositories and Participants) Regulations, 2018",
        "Analysts/Institutional Investor Meet/Con. Call Updates", "Shareholders meeting", "Loss of Share Certificate"]}
    block_deals: {weight: 0.6, full_scale_crore: 200}
    foreign_flows: {weight: 0.4, days: 3, full_scale_crore: 10000}
  guards:
    ban_list: {}
    earnings: {min_days_before_results: 3}
    market_stress: {block_on_stress: true, block_on_geopolitical: true, block_on_major_event: true}
    expensive_options: {max_iv_to_realised: 1.3}
    news_shock: {quiet_minutes: 15, min_weight: 0.45}  # wait after credible big news whose direction is unclear
    iv_rank: {max_iv_rank: 80}       # no purchase when options are dear vs their own history (needs live.iv_history)
    # buy options only when the last hour trended (path efficiency of 5-minute moves; calibrated on real sessions)
    sideways_day: {min_candles: 6, window_candles: 12, min_efficiency: 0.3, block_until_known: true}
  learning:
    horizons_minutes: [30, 90]     # grade every view by the price move this long afterwards
    min_abs_score: 0.2             # votes weaker than this do not count towards a hit rate
    min_votes_for_verdict: 50

# F&O Slack channel. Credentials come only from FNO_SLACK_* environment variables (see fno/notify.py).
# Profile overrides, merged over the values above (see `profile`).
profiles:
  paper:                           # building and testing the framework: more room, more data
    account:
      capital: 500000              # risk 2% = Rs 10,000 a trade: one BANKNIFTY or FINNIFTY lot fits
      max_new_trades_per_day: 3
      max_new_trades_per_week: 12
      max_overnight_premium: 50000
    position_rules:
      exception_max_per_trade: 30000
      normal_deployed: 70000
      max_deployed: 100000
      risk_per_trade_pct: 2.0
    daily_limits:
      max_loss: 15000
      profit_lock: 15000
      weekly_max_loss: 30000
    performance_kill:
      max_drawdown: 50000
  live: {}                         # the conservative values above, unchanged

slack:
  channel_name: fno-desk
  channel_id: C0C89E8QCCD

risk_free_rate: 0.065
