# Story A14c: the stress factor k, recomputed every Sunday from NSE's archived SPAN files as a plain job (no AI, no
# broker key). Research data only; never trades.
#   1. the A9 librarian archives the week's beginning-of-day SPAN files (span-bod) in Drive with their manifest rows;
#   2. `margins stress-factor` checks the archive date by date (every session since 2 Jan 2020, A7's calendar), then
#      appends one row to research/data/margins/stress_factor.csv: a rise applies at once, any fall is held for the
#      owner (owner, 15 Oct 2026, DESK_DECISIONS da0f769d). It writes its evidence CSV to Drive with a receipt (story
#      O9b step 2) and its file list and summary beside the factor file, and sends one #fno-desk line;
#   3. the factor row, the file list, the summary, the evidence receipt and the manifest rows are committed. Nothing
#      here edits config.yaml.
# Weekly keeps the row fresh: C2 refuses after 30 days, so three failed Sundays still leave a valid factor.
# A full recompute (every session since 2020; downloads run ahead, risk.stressed_margin.recompute_workers) is a manual
# run with full=true; its first run measures the seconds per file.
name: stress-factor

on:
  schedule:
    - cron: "30 4 * * 0" # Sunday 10:00 IST
  workflow_dispatch:
    inputs:
      full:
        description: "true: read every session since 2 Jan 2020 (about 2.5 hours), not only the new ones"
        required: false
        default: "false"

permissions:
  contents: write # commits the factor row, its evidence and the manifest rows

concurrency:
  group: stress-factor
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      STRESS: research/data/margins/stress_factor.csv research/data/margins/stress
      RECEIPTS: receipts/data/margins/stress-evidence
      MANIFESTS: research/data/manifests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt # never requirements-groww.txt: no broker SDK or key here
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-stress-factor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Archive the last two weeks' beginning-of-day SPAN files in Drive (A9)
        id: librarian
        continue-on-error: true
        run: python -m fno data-librarian span-bod --from "$(date -d '-14 days' +%F)"
      - name: Recompute the stress factor (one row, or nothing and one #fno-desk line)
        id: stress
        continue-on-error: true
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "${FULL:-false}" = "true" ]; then python -m fno margins stress-factor --full
          else python -m fno margins stress-factor; fi
      - name: Commit the factor row, its evidence and the manifest rows
        id: commit
        env:
          WROTE: ${{ steps.stress.outcome == 'success' }}
        run: | # the factor row and evidence only from a run that succeeded; the manifest rows always
          if [ "$WROTE" = "true" ]; then git add -- $STRESS; fi
          if [ "$WROTE" = "true" ] && [ -d "$RECEIPTS" ]; then git add -- "$RECEIPTS"; fi
          git add -- "$MANIFESTS"
          git diff --cached --quiet || git commit -m "A14c Actions: stress factor $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: One line to #fno-desk when the row was computed but not committed (C2 still reads the previous row)
        if: ${{ failure() && steps.commit.outcome == 'failure' && steps.stress.outcome == 'success' }}
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O stress factor: the run's result was NOT committed to main (C2 still reads the previous row); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: One line to #fno-desk when the librarian failed (the factor step alerts by itself)
        if: ${{ always() && steps.librarian.outcome != 'success' }}
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O stress factor: the Drive archive step failed; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
      - name: Fail the run when the factor step wrote nothing (already alerted)
        if: ${{ always() && steps.stress.outcome != 'success' }}
        run: exit 1
