# Story A20b: NSE's and SEBI's circulars kept point in time. Each run lists the circulars not seen before (NSE: its
# circulars API for yesterday and today; SEBI: its latest circulars page) with the time first seen, saves the file of
# each F&O-relevant one, and writes the run's new rows as one part of `circulars/list`, all write-once in the owner's
# Drive (O9); the repository gets only their SHA-256 receipts (committed). Research data only; it never trades.
# Secrets: the Drive and Slack ones the other jobs use; none is printed.
name: circulars

on:
  schedule:
    - cron: "30 2-16 * * *" # hourly, 08:00-22:00 IST: NSE and SEBI publish through the evening
  workflow_dispatch:

permissions:
  contents: write # commits the receipts (receipts/)

concurrency:
  group: circulars
  cancel-in-progress: false

jobs:
  circulars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-circulars"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: NSE and SEBI circulars (the job alerts #fno-desk itself, naming every problem)
        id: circulars
        run: python -m fno circulars
      - name: Alert #fno-desk when the run failed without the job's own line (a crash, a sender that could not post)
        if: ${{ failure() && steps.circulars.outputs.posted != 'true' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O circulars: the GitHub Actions run failed without its own alert; see $RUN_URL"
