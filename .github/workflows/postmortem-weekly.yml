# Story LR1: the weekly post-mortem (forecasts, weather, data health). A plain scheduled job; it never places orders and
# decides no trade. Saturday 10:41 IST (owner, 15 Oct 2026): G8's own v4 report, the code-built lines committed, then
# the one AI routine is fired (summary, then objections; it pushes its two files). Saturday 11:41 IST: the summary's
# exact number check and the objections' check, then one post to #fno-desk (FNO_SLACK_BOT_TOKEN only) and the publish
# record committed. Every commit runs the public-record scan (story O5); never --no-verify.
name: postmortem-weekly

on:
  schedule:
    - cron: "11 5 * * 6" # 10:41 IST on Saturdays: build the lines and fire the routine
    - cron: "11 6 * * 6" # 11:41 IST on Saturdays: check and post once
  workflow_dispatch:
    inputs:
      step:
        description: "build (lines and fire) or publish (check and post)"
        type: choice
        options: [build, publish]
        default: build
      week_ending:
        description: "The week's Saturday, YYYY-MM-DD (default: the latest Saturday in IST)"
        type: string
        default: ""

permissions:
  contents: write # commits the v4 report, the lines, the fire log and the publish record

concurrency:
  group: postmortem-weekly
  cancel-in-progress: false

jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      # G10 completion: G8's v4 report reads the day labels (release records) from Drive through O9's verified cache
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_ROUTINE_POSTMORTEM_TRIGGER_ID: ${{ secrets.FNO_ROUTINE_POSTMORTEM_TRIGGER_ID }}
      FNO_ROUTINE_POSTMORTEM_TOKEN: ${{ secrets.FNO_ROUTINE_POSTMORTEM_TOKEN }}
      STEP: ${{ github.event.schedule == '11 6 * * 6' && 'publish' || inputs.step || 'build' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity, the public-record scan (story O5) and the week's Saturday
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-postmortem"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SAT="${{ inputs.week_ending }}"
          if [ -z "$SAT" ]; then SAT=$(python -c "from fno.models import now_ist; from fno.learning.week import latest_saturday; print(latest_saturday(now_ist().date()))"); fi
          echo "SAT=$SAT" >> "$GITHUB_ENV"
      - name: G8's v4 report and the week's lines
        if: ${{ env.STEP == 'build' }}
        run: |
          set -o pipefail
          python -m fno forecast-v4-scores report --as-of "$SAT" > /dev/null
          python -m fno postmortem weekly --week-ending "$SAT" --post | tee postmortem.log
          git add research/forecasts/v4_scores research/postmortems
          git diff --cached --quiet || git commit -m "LR1 Actions: post-mortem lines for the week ending $SAT"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: Fire the post-mortem routine (after the lines are on main)
        if: ${{ env.STEP == 'build' }}
        run: |
          python -m fno postmortem fire --week-ending "$SAT" | tee -a postmortem.log
          git add research/postmortems
          git diff --cached --quiet || git commit -m "LR1 Actions: post-mortem routine fired for $SAT"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: Check the AI's files and post once to #fno-desk
        if: ${{ env.STEP == 'publish' }}
        run: |
          git pull --no-rebase --no-edit origin main
          python -m fno postmortem publish --week-ending "$SAT" | tee postmortem.log
          git add research/postmortems
          git diff --cached --quiet || git commit -m "LR1 Actions: post-mortem posted for $SAT"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() }}
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O weekly post-mortem (GitHub Actions) failed: $(head -n 1 postmortem.log 2>/dev/null); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
