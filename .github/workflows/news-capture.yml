# Story A19: news and announcements with the time we first saw them. One long run polls the allowed RSS feeds every 5
# minutes inside the owner's window (config.yaml `news.active_window`), writes its records to the owner's private
# Drive (headlines never enter this public repository or its logs) and commits only SHA-256 receipts and O10's
# capture-error rows. GitHub's cron is unreliable here, so a run starts its own successor; news-capture-kick.yml
# restarts a failed run and is the cron backstop. Research data only: it never trades.
name: news-capture

on:
  workflow_dispatch:

permissions:
  contents: write # receipts and capture-error rows
  actions: write # dispatches its own successor

concurrency:
  group: news-capture # never two pollers; a queued run waits for the live one
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # the loop ends at 330 minutes: setup, the probe, the memory load and the last flush fit
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Probe the feeds from this runner (status and counts only)
        continue-on-error: true # the loop records every feed failure itself
        run: python -m fno news probe
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-news-capture"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Poll the feeds
        id: loop
        run: python -m fno news run --max-minutes 330
      - name: Start the successor
        if: ${{ always() && steps.loop.outputs.successor == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news-capture.yml --ref main
      - name: "Alert #fno-desk when the job itself failed"
        if: ${{ failure() && steps.loop.outputs.recorded != 'true' }} # a failure the run recorded has alerted once
        run: >
          python -c "from fno.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O news capture: the GitHub Actions run failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
