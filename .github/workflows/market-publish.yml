# Story P6: the NSE market read models for the dashboard (Screener 33, Markets 34), run as a plain scheduled job (no AI
# session: O6; Claude's cloud containers cannot reach Postgres on port 5432, response 50 addendum 2). It archives the
# session's NSE files (and NSE's later versions, A11) to the owner's Drive, builds and validates every block against
# the pinned W11 contract, publishes them in one transaction to the Azure `fno` schema as fno_writer, and reads back
# what it published (counts and SHA-256 only). It first runs `market db-check` (TLS verified against the pinned Azure
# roots; only current_user and the publisher's rights); the `check_only` input stops there. NSE's session calendar decides the session; a closed day publishes
# nothing, and a second run of the same day adds no rows (a publication is named by its content). Research data only;
# it never trades. Secrets: FNO_DB_URL (the owner's one step) and the Drive and Slack ones the other jobs use; none is
# printed or written to a file.
name: market-publish

on:
  schedule:
    - cron: "40 1 * * *" # 07:10 IST: the previous session, after NSE's late rewrites (Actions often starts late)
  workflow_dispatch:
    inputs:
      day:
        description: "Session to publish, YYYY-MM-DD (empty: the last session before today, IST)"
        type: string
        required: false
        default: ""
      check_only:
        description: "Only connect as the publisher (TLS, pinned roots) and read its identity and rights; no archive"
        type: boolean
        default: false

permissions:
  contents: write # commits the manifest and revision rows of the files it archives (research/data/manifests/)

concurrency:
  group: market-publish # one publisher at a time
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FNO_DB_URL: ${{ secrets.FNO_DB_URL }}
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Database check (connects, reads only current_user and the publisher's rights)
        run: |
          set -o pipefail
          python -m fno market db-check | tee db-check.log
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.check_only }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-market-publish"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Archive, build, validate, publish and read back
        if: ${{ !inputs.check_only }}
        env:
          DAY: ${{ inputs.day }} # passed through the environment, never pasted into the shell line
        run: |
          set -o pipefail
          python -m fno market daily ${DAY:+--day "$DAY"} | tee market.log
      - name: Alert #fno-desk when the job failed without its own alert
        if: ${{ failure() }}
        run: |
          grep -q "^Omenix F&O market read models" market.log 2>/dev/null && exit 0
          CAUSE=$(grep -h "^database check FAILED" db-check.log 2>/dev/null | head -1)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O market publish: the GitHub Actions run failed${CAUSE:+ ($CAUSE)}; see $RUN_URL"
