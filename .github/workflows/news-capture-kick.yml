# Story A19: the only starter of news-capture besides a run's own successor. It starts one only when the polling
# window is open (or the overnight bridge is on) and no news-capture run is queued or in progress, so a cron never
# queues behind a live poller. After a failed run of at least 10 minutes it restarts the chain; after a shorter one
# (a failure at start) it records one restart_stopped row and alerts instead of looping. Research data only.
name: news-capture-kick

on:
  schedule: # spread over the 07:00-23:00 IST window; GitHub starts crons here hours late, so these are a backstop
    - cron: "43 1 * * *" # 07:13 IST
    - cron: "13 4 * * *" # 09:43 IST
    - cron: "43 6 * * *" # 12:13 IST
    - cron: "43 9 * * *" # 15:13 IST
    - cron: "43 12 * * *" # 18:13 IST
    - cron: "13 15 * * *" # 20:43 IST
  workflow_run:
    workflows: [news-capture]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write # a restart_stopped row in O10's capture-error log
  actions: write # reads news-capture runs and dispatches one

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-news-capture"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Start news-capture if none is alive
        run: python -m fno news kick
      - name: "Alert #fno-desk when the kick itself failed"
        if: ${{ failure() }}
        run: >
          python -c "from fno.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O news capture: the kick failed, so news-capture may not be
          running; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
