# Story A14: C2's margin inputs from NSE Clearing as a plain job (no AI session). Research data only; never trades.
#   1. the A9 librarian archives the last week's beginning-of-day SPAN files (nsccl.<d>.i1.zip, span-bod) in Drive,
#      up to today's session (its file is written the evening before: 20:00-24:00 IST in 2026, by 03:05 since 2020);
#   2. the A11 sweep keeps any later NSE version beside the original;
#   3. `margins nse-span` reads each pending session's FIRST archived file, refuses one written at or after 09:00 IST
#      on its day, and appends SF, SC and BF margins per lot (SPAN + exposure) to research/data/margins/margins.csv,
#      never editing a row; a missing or invalid file writes nothing for that day and posts one #fno-desk line;
#   4. the manifest rows and the margins file are committed (only valid rows are ever written).
# UNSCHEDULED until the independent check passes (story A14 criterion 1; claims response 74). Once it passes,
# add the schedule:  - cron: "15 2 * * *" (07:45 IST, today's session) and - cron: "0 3 * * *" (08:30 IST retry), both
# before the 09:15 open.
name: nse-margins

on:
  workflow_dispatch:
    inputs:
      from:
        description: "first day to archive, YYYY-MM-DD (default: a week before the due session; 2026-10-01 fills A14's start)"
        required: false
        default: ""

permissions:
  contents: write # commits the margins file and the manifest rows

concurrency:
  group: nse-margins
  cancel-in-progress: false

jobs:
  margins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      MARGINS: research/data/margins/margins.csv
      MANIFESTS: research/data/manifests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-nse-margins"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Archive the last week's beginning-of-day SPAN files in Drive (A9)
        id: librarian
        continue-on-error: true
        env:
          FROM: ${{ inputs.from }}
        run: |
          due="$(python -m fno margins nse-span --due-day)"
          python -m fno data-librarian span-bod --from "${FROM:-$(date -d "$due -7 days" +%F)}" --to "$due"
      - name: Keep later NSE versions beside the originals (A11)
        id: revisions
        continue-on-error: true
        run: |
          due="$(python -m fno margins nse-span --due-day)"
          python -m fno data-revisions sweep span-bod --from "$(date -d "$due -7 days" +%F)" --to "$due"
      - name: Append each pending session's margins (point in time, never editing a row)
        id: margins
        continue-on-error: true
        run: python -m fno margins nse-span
      - name: Commit the manifest rows and the margins file
        run: |
          git add "$MANIFESTS" "$MARGINS"
          git diff --cached --quiet || git commit -m "A14 Actions: NSE margins $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: One line to #fno-desk when the librarian failed (the margins step alerts by itself)
        if: ${{ steps.librarian.outcome != 'success' }}
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O NSE margins: the Drive archive step failed; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
      - name: Fail the run when the margins step stopped (already alerted)
        if: ${{ steps.margins.outcome != 'success' }}
        run: exit 1
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() && steps.librarian.outcome == 'success' && steps.margins.outcome == 'success' }}
        run: >
          python -c "from fno.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O NSE margins (GitHub Actions) failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
