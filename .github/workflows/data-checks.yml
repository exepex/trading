# Story O9b: the `data`-marked tests, which check data moved from the repository to Drive (write-once, receipts). They
# never run in checks.yml (no secrets there, and the tests block the network): this job first brings every moved
# group's receipted files into the verified cache, then runs `pytest -m data`, which reads that cache only. Daily, and
# after a push to main that changes receipts or tests. Research only; it writes nothing. One #fno-desk line when it
# fails. Secrets: the Drive ones (read) and Slack's; none is printed or written to a file.
name: data-checks

on:
  schedule:
    - cron: "11 4 * * *" # 09:41 IST every day
  push:
    branches: [main]
    paths: ["receipts/data/**", "tests/**", "fno/storage/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-checks
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      MOVED: data/vix # every Drive prefix O9b has moved, one per group
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Bring the moved groups' files into the verified cache
        id: sync
        run: for prefix in $MOVED; do python -m fno data-cache sync "$prefix" || exit 1; done
      - name: The data tests, on the verified cache only
        id: tests
        run: python -m pytest -q -m data
      - name: Alert the desk channel when the data checks failed
        if: ${{ failure() }} # O10's watcher sees an alert step on every failure
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O data checks (O9b): sync ${{ steps.sync.outcome }}, tests ${{ steps.tests.outcome }} (a Drive copy missing or changed, or a moved table failing its test); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
