# Story G3: Book 1's daily forecast record, as a plain scheduled job (no AI; owner principle, story O6). Book 1 is the
# frozen mean of two baselines (fno/forecast/book1_method.py), so nothing here needs reasoning.
# Today every trading day gets a recorded "no forecast": the frozen protocol (research/forecasts/PROTOCOL.md section
# 1) allows live inputs only from story E2's market pack, which does not exist yet. The job still runs daily so the
# record, its commit time and the #fno-desk line are proven before live inputs are approved.
# Timing: GitHub's schedule can start late, so it starts at about 14:00 IST and waits until 15:10 IST (after the 3 pm
# quote snapshots); the record must be committed by 15:30 IST (the deadline), or scoring ignores it. Never orders.
name: forecast-capture

on:
  schedule:
    - cron: "30 8 * * *" # 14:00 IST every day: the session calendar decides (a closed day records nothing)
  workflow_dispatch:

permissions:
  contents: write # commits the day's record

concurrency:
  group: forecast-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-forecast-capture"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Wait until 15:10 IST (after the 3 pm quote snapshots)
        run: |
          now=$(TZ=Asia/Kolkata date +%s); start=$(TZ=Asia/Kolkata date -d 'today 15:10' +%s)
          if (( now < start )); then sleep $(( start - now )); fi
      - name: Record Book 1's forecasts
        run: |
          set -o pipefail
          python -m fno forecast capture --run-id "${{ github.run_id }}-${{ github.run_attempt }}" | tee capture.log
      - name: Commit the record (deadline 15:30 IST)
        run: |
          git add research/forecasts/live
          git diff --cached --quiet || git commit -m "G3 Actions: Book 1 forecast record $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: One line to #fno-desk
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "$(head -n 1 capture.log)"
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() }}
        run: >
          python -c "from fno.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O forecast capture (GitHub Actions) failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
