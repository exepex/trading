# Stories G2-G3 under forecast protocol version 2 (research/forecasts/PROTOCOL_v2.md): the daily live forecasts of the
# three baselines and Book 1, as a plain scheduled job (no AI; owner principle, story O6). Book 1 is the frozen mean of
# two baselines (fno/forecast/book1_method.py), so nothing here needs reasoning. Never orders.
# Inputs: the day's canonical A4 snapshot (committed by the 3 pm recorder), the official closes through the day before
# (story O6's index-closes job appends them each evening) and the panel's past IV30. Each same-day field counts only if
# observed by 15:00:00 IST. The job recomputes the v2 golden cases, then checks the version 2 freeze (full history,
# fetch-depth 0): a difference or a failed freeze check fails the run before any forecast.
# Timing: GitHub's schedule can start late, so it starts at about 14:00 IST, waits until 15:10 IST, pulls until the
# day's canonical snapshot is in (at most until 15:13 IST), and generates the forecasts from the pack by 15:15 IST. The
# receipt line (pack hash, records hash, generation time) is locked in this run's log and step summary; the Git push
# after it is transport only.
# Stories F1 and G5 (Hybrid and AI team): the pack alone is committed first, then each AI book's routine is fired with
# its pointer; the books seal their answers on main by 15:15:00 IST (GitHub's push time) and reveal them after it. Book
# 1's and the baselines' records are committed only after the collection (after 15:15), so no AI book can read them in
# the repository before its own answer is sealed.
# Start (response 67 addendum 5): GitHub's schedule ran hours late on 14 Oct and the day was lost, so the run also starts
# on the push that lands the 3 pm canonical snapshot on main (a push event starts within seconds; a push made with an
# Actions run's own token starts nothing, so this covers the routine's commit). The cron stays as the fallback. The gate
# job, serialised by the concurrency group, lets at most one run capture a day.
name: forecast-capture

on:
  push:
    branches: [main]
    paths: ["research/data/quotes/**/*.canonical"]
  schedule:
    - cron: "30 8 * * *" # 14:00 IST every day: the fallback; the session calendar decides (a closed day records nothing)
  workflow_dispatch:

permissions:
  contents: write # commits the day's record

concurrency:
  group: forecast-capture
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the newest main: an earlier run's pack shows here, whatever commit started this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: At most one capture a day; a late push run stops (standard library only, no install)
        id: gate
        run: python -m fno.pipeline.capture_gate --event "${{ github.event_name }}" | tee -a "$GITHUB_OUTPUT"
  capture:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      FNO_ROUTINE_BOOK2_HYBRID_TRIGGER_ID: ${{ secrets.FNO_ROUTINE_BOOK2_HYBRID_TRIGGER_ID }}
      FNO_ROUTINE_BOOK2_HYBRID_TOKEN: ${{ secrets.FNO_ROUTINE_BOOK2_HYBRID_TOKEN }}
      FNO_ROUTINE_BOOK3_AI_TRIGGER_ID: ${{ secrets.FNO_ROUTINE_BOOK3_AI_TRIGGER_ID }}
      FNO_ROUTINE_BOOK3_AI_TOKEN: ${{ secrets.FNO_ROUTINE_BOOK3_AI_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }} # reads GitHub's push log of main: the AI books' receipt times
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the protocol freeze check needs the history back to the protocol commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-forecast-capture"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Recompute the v2 golden cases (shared libraries are recorded, not byte-checked; a difference stops here)
        run: python tools/forecast_live_golden.py
      - name: Wait until 15:10 IST (after the 3 pm quote snapshots)
        run: |
          now=$(TZ=Asia/Kolkata date +%s); start=$(TZ=Asia/Kolkata date -d 'today 15:10' +%s)
          if (( now < start )); then sleep $(( start - now )); fi
      - name: Pull until the day's canonical A4 snapshot is in (at most until 15:13 IST)
        run: |
          limit=$(TZ=Asia/Kolkata date -d 'today 15:13' +%s)
          until python -m fno forecast snapshot-ready || (( $(TZ=Asia/Kolkata date +%s) >= limit )); do
            sleep 20; git pull -q --no-rebase --no-edit origin main
          done
      - name: Generate the forecasts from the pack by 15:15 IST (refused unless the version 2 freeze holds)
        run: |
          set -o pipefail
          python -m fno forecast capture --run-id "${{ github.run_id }}-${{ github.run_attempt }}" | tee capture.log
          grep '^receipt: ' capture.log >> "$GITHUB_STEP_SUMMARY" || echo "no receipt: nothing recorded" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the pack only (the AI books read it; the records wait until after 15:15)
        run: |
          git add 'research/forecasts/live_v2/*/*_pack.json' # no pack on a closed day: nothing to commit
          git diff --cached --quiet || git commit -m "G3 Actions: forecast v2 pack $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: Fire the AI books' routines (F1, G5; one #fno-desk line per failure)
        run: python -m fno ai fire | tee ai.log
      - name: Wait for the AI books' reveals, v2's and v4's (at most until 15:30 IST; G11, each audit is written once)
        run: |
          limit=$(TZ=Asia/Kolkata date -d 'today 15:30' +%s)
          until { python -m fno ai reveals-ready && python -m fno ai reveals-ready --protocol v4; } || (( $(TZ=Asia/Kolkata date +%s) >= limit )); do
            sleep 20; git pull -q --no-rebase --no-edit origin main
          done
          git pull -q --no-rebase --no-edit origin main
      - name: Collect the AI books' forecasts (GitHub's push times are the receipts)
        run: |
          set -o pipefail
          python -m fno ai collect | tee -a ai.log
          python -m fno ai collect --protocol v4 | tee -a ai.log # G11: refuses before daily.live_from.ai_books_v4
          grep '^ai receipt: ' ai.log >> "$GITHUB_STEP_SUMMARY" || echo "no AI receipt: nothing collected" >> "$GITHUB_STEP_SUMMARY"
      - name: Record new weekly audit draws and list the transcript audits due (owner's condition 1)
        if: ${{ !cancelled() }}
        run: python -m fno ai audits-due | tee audits.log
      - name: Commit the records (transport; the receipts above are the lock)
        if: ${{ !cancelled() }}
        run: |
          git add research/forecasts # Book 1, the baselines, the AI books and the fire log
          git add accounting/ai_usage.csv # the AI books' minutes ai collect recorded (story F8c)
          git diff --cached --quiet || git commit -m "G3/G5 Actions: forecast v2 records $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: One line to #fno-desk
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "$(head -n 1 capture.log; grep '^Omenix F&O AI' ai.log; head -n 1 audits.log)"
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() }}
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O forecast capture (GitHub Actions) failed: $(head -n 1 capture.log 2>/dev/null); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
