# Story A12: the company filings archive, run as a plain scheduled job (no AI session). Research data only: it reads
# NSE's public filing lists and XBRL files (about one request per second per host) and saves them to the owner's
# Google Drive; it never trades. Until the backfill is complete every run continues it (each stops itself after 5.5
# hours and the next resumes); after that the archive check runs once a day and the day lists add yesterday.
# Secrets: the owner adds them once (docs/stories/A12-owner-checklist.md); none is printed or written to a file.
name: filings-archive

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours; once complete, `--daily` makes three of the four runs a no-op
  workflow_dispatch:
    inputs:
      probe_only:
        description: "Only check that NSE's filing lists answer from GitHub's runners (no Drive, no secrets)"
        type: boolean
        default: false

permissions:
  contents: write # commits the manifest rows, gaps and run log (research/data/manifests/)

concurrency:
  group: filings-archive # one writer at a time: the manifests are append-only files
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.FNO_GDRIVE_SERVICE_ACCOUNT_JSON }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Probe NSE from this runner
        run: python -m fno filings probe
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.probe_only }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-filings-archive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Results and shareholding XBRL (backfill, then daily)
        if: ${{ !inputs.probe_only }}
        run: python -m fno filings archive --daily
      - name: Announcement and board-meeting day lists
        if: ${{ !inputs.probe_only }}
        run: python -m fno filings day-lists
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() && !inputs.probe_only }}
        run: >
          python -c "from fno.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O filings archive: the GitHub Actions run failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
