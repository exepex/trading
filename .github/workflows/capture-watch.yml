# Story O10: every job's run that does not succeed leaves one committed row in research/ops/capture_errors.csv
# (date, job, step, kind, message, run URL), and one #fno-desk line unless every failed job ran its own alert step
# ("Alert..." or "One line to..."): a cancel, a timeout or a failed job with no alert step posts nothing itself
# (judge 350). Runs on GitHub's workflow_run event, so no watched workflow is edited (panel-days.yml stays frozen,
# protocol v3). A run GitHub never starts gives no event: the evening health check (O8) reports it. Research only;
# never trades, never re-runs a job.
# Secrets: FNO_SLACK_BOT_TOKEN (the line) and the run's own GITHUB_TOKEN (reads the watched run's steps, never a log).
name: capture-watch

on:
  workflow_run:
    # every scheduled job except CI (checks); tests/health/test_capture_watch_workflow.py keeps this list complete
    workflows:
      - filings-archive
      - flows-download
      - fo-masters
      - forecast-capture
      - forecast-scores
      - global-cues
      - health-check
      - index-closes
      - market-publish
      - nse-margins
      - panel-days
      - participant-oi-release
      - participant-oi-sweep
      - participant-oi-watch
      - postmortem-weekly
      - quote-recorder-nse
      - stress-factor
      - v4-fire
      - vix-history
    types: [completed]

permissions:
  actions: read # the watched run's jobs and step names
  contents: write # commits research/ops/capture_errors.csv

# No concurrency group: GitHub keeps one pending run per group and cancels the others, which would lose rows when two
# watched runs fail together. The log merges by union (.gitattributes) and the push is retried.

jobs:
  record:
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: # the watched run, passed as data (never pasted into a script)
      WATCHED_ID: ${{ github.event.workflow_run.id }}
      WATCHED_NAME: ${{ github.event.workflow_run.name }}
      WATCHED_URL: ${{ github.event.workflow_run.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-capture-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record the failed run, and alert when it posted nothing itself
        env: # only this step sees them
          FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m fno health capture-failed --run-id "$WATCHED_ID"
      - name: Commit the capture-error row
        if: ${{ always() }}
        run: |
          git add research/ops/capture_errors.csv
          git diff --cached --quiet && exit 0
          git commit -m "Data: capture error $(TZ=Asia/Kolkata date +%F) $WATCHED_NAME"
          for attempt in 1 2 3; do
            git pull --no-rebase --no-edit origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Alert #fno-desk when the watcher itself failed
        if: ${{ failure() }}
        env:
          FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O capture watcher failed for $WATCHED_NAME run $WATCHED_URL; see $RUN_URL"
