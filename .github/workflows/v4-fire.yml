# Story G10 part 2, section 6: protocol v4's AI fire. The owner's routine pushes the day's release record receipt
# (receipts/data/v4/days/<YYYY>/<date>.json.sha256) with its own credentials, and that push starts this run within
# seconds (a push made with an Actions run's own token starts nothing). No cron (orchestrator, 16 Oct): the push is
# the only start. It fires today's books only: a replayed or older receipt fires nothing, and G11's fire records a
# start after V4_LATEST_FIRE (14:55 IST) as not_fired. The books read the released pack through the verified Drive
# cache, never a checkout file. Never orders.
name: v4-fire

on:
  push:
    branches: [main]
    paths: ["receipts/data/v4/days/**"]

permissions:
  contents: write # the fire log

concurrency:
  group: v4-fire
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      FNO_ROUTINE_BOOK2_HYBRID_TRIGGER_ID: ${{ secrets.FNO_ROUTINE_BOOK2_HYBRID_TRIGGER_ID }}
      FNO_ROUTINE_BOOK2_HYBRID_TOKEN: ${{ secrets.FNO_ROUTINE_BOOK2_HYBRID_TOKEN }}
      FNO_ROUTINE_BOOK3_AI_TRIGGER_ID: ${{ secrets.FNO_ROUTINE_BOOK3_AI_TRIGGER_ID }}
      FNO_ROUTINE_BOOK3_AI_TOKEN: ${{ secrets.FNO_ROUTINE_BOOK3_AI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-v4-fire"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Today's release record only (IST)
        id: day
        run: |
          day=$(TZ=Asia/Kolkata date +%F)
          if [ -f "receipts/data/v4/days/${day:0:4}/${day}.json.sha256" ]; then echo "day=${day}" >> "$GITHUB_OUTPUT"
          else echo "no release record for ${day}: nothing fired" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Fire the AI books on the released pack (G11)
        if: ${{ steps.day.outputs.day != '' }}
        run: python -m fno ai fire --protocol v4 --day "${{ steps.day.outputs.day }}" | tee fire.log
      - name: Commit the fire log (collect, the reveals, coverage and F8c's alerts read it; judge 282)
        if: ${{ !cancelled() && steps.day.outputs.day != '' }}
        run: |
          git add research/forecasts/ai_v4 # G11's v4 fire log: research/forecasts/ai_v4/<YYYY>/<date>_fired.json
          git diff --cached --quiet || git commit -m "G10/G11 Actions: v4 AI fire log ${{ steps.day.outputs.day }}"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: Alert #fno-desk when the fire itself failed
        if: ${{ failure() }}
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O v4 AI fire (GitHub Actions) failed; see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
