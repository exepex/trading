# Story A17 on a schedule (audit Part A2, owner 16 Oct 2026: external data up to date every day): the global cues as a
# plain job (no AI session). Research data only; never trades. `global-cues fill` downloads every cue (US closes and
# FBIL to Drive only, the others into research/data/global-cues/), archives each copy in Drive with its log row,
# extends the tables from 31 days before their last date and rewrites the checks; a cue that fails, or whose newest
# value is older than its limit (STALE), is named and the run fails. The logs and tables are committed even then.
# Two runs a day. Cboe and Nasdaq are downloaded at most once an IST day and a copy drops the US day still running
# (A17's `may_hold_unfinished`), so the day's first run must come after the US close, or that close waits a day:
#   04:41 IST, after the US closes (01:30-02:30 IST) and the Treasury's evening file (by about 04:30 IST), so the
#   overnight cues are first seen before the 09:15 open; GitHub starts this repository's morning crons 4-5 hours late
#   (14-16 Oct 2026), so on such a day they are first seen after 09:15, and the as-of rule (A17) does not count them
#   as known at the open: the cost is a value marked late, never a wrong one;
#   14:11 IST, after RBI's reference rate (about 13:00-13:30 IST); the US cues reuse the morning copy.
# One #fno-desk line when the run fails, naming the cues; O10's capture-watch records the failed run. Secrets: the A12
# Drive and Slack ones; none is printed or written to a file.
name: global-cues

on:
  schedule:
    - cron: "11 23 * * *" # 04:41 IST (the previous UTC day): the overnight US cues before the open
    - cron: "41 8 * * *" # 14:11 IST: RBI's reference rate of the day
  workflow_dispatch:

permissions:
  contents: write # commits the cue tables, logs and checks

concurrency:
  group: global-cues
  cancel-in-progress: false

jobs:
  cues:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      CUES: research/data/global-cues
      MANIFESTS: research/data/manifests/global-cues
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-global-cues"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Download, archive and extend every cue (A17)
        id: fill
        continue-on-error: true
        run: |
          set -o pipefail
          python -m fno global-cues fill | tee "$RUNNER_TEMP/fill.txt"
      - name: Commit the cue tables, logs and checks (also after a failed cue)
        run: |
          git add "$CUES" "$MANIFESTS"
          git diff --cached --quiet || git commit -m "A17 Actions: global cues $(TZ=Asia/Kolkata date '+%F %H:%M')"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: One line to #fno-desk naming the failed or stale cues
        if: ${{ steps.fill.outcome != 'success' }}
        run: |
          cues="$(grep -oE '^[a-z0-9_]+: (FAILED|.*STALE)' "$RUNNER_TEMP/fill.txt" | cut -d: -f1 | paste -sd, - || true)"
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O global cues: ${cues:-the run} failed or stale (the log names why); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() && steps.fill.outcome == 'success' }}
        run: >
          python -c "from fno.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O global cues (GitHub Actions) failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
