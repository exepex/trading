# Story O8: the daily health check. One free job each evening checks, from the repository's files and GitHub's push log,
# that every daily job did its work on time over the sessions of the last 6 days, and posts one summary to #fno-desk.
# A late start is harmless: the window is the same sessions whenever it runs (fno/health/window.py). Research only;
# never trades, never fixes or re-runs a job. It commits only its own run record, research/ops/health_runs.csv.
# Secrets: FNO_SLACK_BOT_TOKEN (the message) and the run's own GITHUB_TOKEN (GitHub's activity log, as F1); none is
# printed or written to a file.
name: health-check

on:
  schedule:
    - cron: "21 12 * * *" # 17:51 IST every day (a jittered minute; GitHub's schedule is best effort)
  workflow_dispatch:

permissions:
  contents: write # commits research/ops/health_runs.csv

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit that first added each file or row, for its push time
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-health-check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check the window and post one summary to #fno-desk
        env: # only this step sees them
          FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m fno health check
      - name: Commit the run record
        if: ${{ always() }}
        run: |
          [ -f research/ops/health_runs.csv ] || exit 0 # a run that failed before its first row records nothing
          git add research/ops/health_runs.csv
          git diff --cached --quiet || git commit -m "Data: health check run $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
