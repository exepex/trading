# Story A20c: the release dates of the big macro numbers kept point in time. Each run snapshots MOSPI's Advance Release
# Calendar (India CPI, IIP, GDP) and the Fed's FOMC calendar into the owner's Drive (O9: write-once parts and the
# documents, receipts committed), so each date is known from the day it was first seen. US CPI and payrolls have no
# source yet (BLS refuses GitHub's runners): reported every run. Research data only; it never trades. Secrets: the
# Drive and Slack ones the other jobs use; none is printed.
name: macro-calendar

on:
  schedule:
    - cron: "0 2 * * *" # 07:30 IST
  workflow_dispatch:

permissions:
  contents: write # commits the receipts (receipts/)

concurrency:
  group: macro-calendar
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-macro-calendar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: MOSPI's and the Fed's release calendars (the job alerts #fno-desk itself, naming every problem)
        id: calendar
        run: python -m fno macro-calendar
      - name: Alert #fno-desk when the run failed without the job's own line (a crash, a sender that could not post)
        if: ${{ failure() && steps.calendar.outputs.posted != 'true' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O macro calendar: the GitHub Actions run failed without its own alert; see $RUN_URL"
