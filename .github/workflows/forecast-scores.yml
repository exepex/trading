# Story G4: score the forecasts every evening (its weekly plain-words summary is posted by LR1's Saturday post-mortem,
# owner 15 Oct 2026: one weekly report; `forecast-scores summary` stays for a manual look). A plain
# scheduled job (no AI; owner principle, story O6); it never places orders. Outcomes use only the official closes
# through the as-of day (story O6's index-closes job appends them at 21:11 IST), so it runs after that job.
# Scores are research records: research/forecasts/scores/<as-of>.json (schema forecast_scores/v1), labelled secondary
# to net profit. Live records are scored only against their capture receipts in Drive's pipeline area.
# STAB1 (owner, 25 Oct 2026: "We are not doing any kind of forecasting"):
# the schedule is removed; nothing scores a forecast.
# Manual dispatch only; the owner's later decision restores the trigger in a judged change (git history before STAB1 has it).
name: forecast-scores

on:
  workflow_dispatch:

permissions:
  contents: write # commits the day's report

concurrency:
  group: forecast-scores
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the protocol freeze checks need the history back to the protocol commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-forecast-scores"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Score every resolvable forecast (refused unless the protocol freezes hold)
        run: |
          set -o pipefail
          python -m fno forecast-scores run | tee scores.log
      - name: Commit the report
        run: |
          git add research/forecasts/scores
          git diff --cached --quiet || git commit -m "G4 Actions: forecast scores $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() }}
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O forecast scores (GitHub Actions) failed: $(head -n 1 scores.log 2>/dev/null); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
