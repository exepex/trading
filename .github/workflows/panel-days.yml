# Story A13 (G1 protocol v3 proposal, response 68): each new session's NIFTY option and future rows appended to the
# panel (research/data/nifty-panel/) as a plain job (no AI session). Research data only; never trades.
#   1. the A9 librarian archives the last week's F&O daily files (fo-bhavcopy) in Drive;
#   2. the A11 sweep keeps any later NSE version beside the original;
#   3. `pipeline panel-days` verifies the whole panel against its manifest, builds each session after the panel's last
#      day with A3's builder from the FIRST archived version of its F&O and index-close files (A11's later versions are
#      recorded, never used), checks that O6's official close came from the same index-close file, and appends all
#      pending sessions or none, never rewriting a day;
#   4. the panel is committed ONLY when step 3 exits 0 (the A9 manifest rows always): a crash or a stop publishes nothing,
#      and the next run (the morning retry) starts again from the same day.
# It writes only under G1 protocol v3's freeze (its `panel-days` section; full history: fetch-depth 0); a missing or
# failing freeze record fails the run with one #fno-desk line. Runs append through the last day whose files are due
# (today from 21:00 IST, else yesterday). One #fno-desk line when a step fails.
name: panel-days

on:
  schedule:
    - cron: "11 16 * * *" # 21:41 IST, after index-closes.yml (21:11): today's session; the calendar decides
    - cron: "41 6 * * *" # 12:11 IST: retry for yesterday's session, after index-closes' 11:41 retry, before 14:00
  workflow_dispatch:

permissions:
  contents: write # commits the appended panel days

concurrency:
  group: panel-days
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      PANEL: research/data/nifty-panel
      MANIFESTS: research/data/manifests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the v3 freeze check needs the history back to the protocol commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-panel-days"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Archive the last week's F&O daily files in Drive (A9)
        id: librarian
        continue-on-error: true
        run: |
          python -m fno data-librarian fo-bhavcopy \
            --from "$(TZ=Asia/Kolkata date -d '-7 days' +%F)" --to "$(python -c 'from fno.models import now_ist; from fno.pipeline.panel_days import last_complete_day; print(last_complete_day(now_ist()))')"
      - name: Keep later NSE versions beside the originals (A11)
        id: revisions
        continue-on-error: true
        run: |
          python -m fno data-revisions sweep fo-bhavcopy \
            --from "$(TZ=Asia/Kolkata date -d '-7 days' +%F)" --to "$(python -c 'from fno.models import now_ist; from fno.pipeline.panel_days import last_complete_day; print(last_complete_day(now_ist()))')"
      - name: Append the new sessions (point in time, never rewriting; only under the v3 freeze)
        id: append
        continue-on-error: true
        run: python -m fno pipeline panel-days
      - name: Commit the A9 manifest rows always, the panel only after a clean append
        run: |
          git add "$MANIFESTS"
          if [ "${{ steps.append.outcome }}" = "success" ]; then git add "$PANEL"; fi
          git diff --cached --quiet || git commit -m "A13 Actions: NIFTY panel sessions $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: One line to #fno-desk when the librarian failed (the append step alerts by itself)
        if: ${{ steps.librarian.outcome != 'success' }}
        run: |
          python -c "import sys; from fno.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O daily NIFTY panel: the archive step failed (Drive, NSE or the calendar: its log names it); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
      - name: Fail the run when the append stopped (a named stop posts its own line; any other crash is alerted below)
        if: ${{ steps.append.outcome != 'success' }}
        run: exit 1
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() && steps.librarian.outcome == 'success' }} # an unexpected append crash is never silent (O8c)
        run: >
          python -c "from fno.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O daily NIFTY panel (GitHub Actions) failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
