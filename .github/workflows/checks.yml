# Safety net for parallel sessions pushing to main: the checks CLAUDE.md requires before every push, plus the
# public-record scan (story O5). No secrets are used.
name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the G1 freeze check needs the freeze commit in history; it fails on a shallow clone, by design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: python -m pytest -q
      - run: ruff check fno tests tools
      - run: python tools/check_imports.py
      - run: python tools/check_records.py
