# Safety net for parallel sessions pushing to main: the checks CLAUDE.md requires before every push, plus the
# public-record scan (story O5). No secrets are used.
# A push that changes only lane-3 files (judge and review files, conversation logs, decision and register rows, number
# claims) skips pytest, ruff and the import check: none of them reads those files. The record scan runs on every push:
# on every tracked file when code changed, on the changed files otherwise (the rest was scanned when it was committed
# and pushed, and a lane-3-only push cannot change the scan's own code). `tools/ci_scope.sh` decides; any doubt counts
# as code. The number check (story O12) also runs on every push: a review file alone can reuse a number.
name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the G1 freeze check needs the freeze commit in history; it fails on a shallow clone, by design
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: sh tools/ci_scope.sh "$BASE" "$GITHUB_SHA" "$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt ruff
      - if: steps.scope.outputs.code == 'true'
        run: python -m pytest -q -n auto
      - if: steps.scope.outputs.code == 'true'
        run: ruff check fno tests tools
      - if: steps.scope.outputs.code == 'true'
        run: python tools/check_imports.py
      - if: steps.scope.outputs.code == 'true'
        run: python tools/check_records.py
      - if: steps.scope.outputs.code != 'true'
        run: xargs -0 -r python tools/check_records.py < "$RUNNER_TEMP/changed"
      - if: always() # story O12: every push, last, so a reused number never stops the record scan above
        run: python tools/check_numbers.py
